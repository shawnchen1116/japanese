function fillVoices(){
  if(!synth)return; voices=synth.getVoices(); var sel=$('voice'),cur=load('jp_voice',''); sel.innerHTML='';
  var ja=voices.filter(function(v){return /^ja/i.test(v.lang)}), rest=voices.filter(function(v){return !/^ja/i.test(v.lang)});
  function add(list,label){ if(!list.length)return; var g=document.createElement('optgroup'); g.label=label; list.forEach(function(v){var o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';g.appendChild(o)}); sel.appendChild(g)}
  add(ja,'Japanese voices'); if(!ja.length){add(rest,'Other voices (no Japanese voice found)'); $('warn').style.display='block'; $('warn').textContent='No Japanese voice was found on this device. Install a Japanese text-to-speech voice in your system settings (or try Chrome/Edge/Safari).'} else $('warn').style.display='none';
  if(!sel.options.length){var o=document.createElement('option');o.textContent='Default voice';o.value='';sel.appendChild(o)}
  if(cur){for(var i=0;i<sel.options.length;i++) if(sel.options[i].value===cur){sel.selectedIndex=i;break}}
}
if(synth){fillVoices(); if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=fillVoices; setTimeout(fillVoices,500)} else {$('warn').style.display='block';$('warn').textContent='Speech synthesis is not supported in this browser.'}
$('voice').onchange=function(){store('jp_voice',this.value)};
$('rate').value=load('jp_rate','0.7'); $('rate').onchange=function(){store('jp_rate',this.value)};
$('gap').value=load('jp_gap','1'); $('gap').onchange=function(){store('jp_gap',this.value)};
function curVoice(){var v=$('voice').value; for(var i=0;i<voices.length;i++) if(voices[i].voiceURI===v) return voices[i]; return null}
function clearHL(){var p=document.querySelectorAll('.playing'); for(var i=0;i<p.length;i++)p[i].classList.remove('playing')}
function status(t){$('status').textContent=t}
function stop(){token++; paused=false; if(synth)synth.cancel(); clearHL(); $('pause').textContent='⏸'}
function speak(text,cb){
  var u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; var v=curVoice(); if(v){u.voice=v;u.lang=v.lang}
  u.rate=parseFloat($('rate').value); u.onend=cb; u.onerror=cb; synth.speak(u);
}
function next(my){
  if(my!==token)return; clearHL();
  if(qi>=queue.length){status('Finished.');return}
  var el=queue[qi]; el.classList.add('playing');
  var r=el.getBoundingClientRect(); if(r.top<110||r.bottom>window.innerHeight-20) el.scrollIntoView({block:'center',behavior:'smooth'});
  status('Playing '+(qi+1)+' / '+queue.length+(queue.length>1?'':' (single line)'));
  speak(el.getAttribute('data-tts'),function(){ if(my!==token)return; qi++; setTimeout(function(){next(my)},parseFloat($('gap').value)*1000)});
}
function run(els){ if(!synth||!els.length)return; stop(); queue=els; qi=0; var my=token; setTimeout(function(){next(my)},120)}
function playables(root,withPr){ var l=root.querySelectorAll('[data-tts]'),a=[]; for(var i=0;i<l.length;i++){ if(l[i].classList.contains('pr-item')&&!withPr)continue; a.push(l[i])} return a}
function withPr(){var c=$('inclpr'); return c?c.checked:false}
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.closest&&t.closest('a.kj')){e.preventDefault();var w=t.closest('.rw');w.classList.toggle('open');return}
  if(t.closest&&t.closest('a.nl')){e.preventDefault();t.closest('.nt').classList.add('open');return}
  var b=t.closest&&t.closest('button.pb'); if(b){ var ln=b.closest('[data-tts]'); run([ln]); return}
  var lb=t.closest&&t.closest('button.pl'); if(lb){ run(playables(document.getElementById(lb.getAttribute('data-l')),withPr())); return}
});
$('playall').onclick=function(){run(playables(document.getElementById('lessons'),withPr()))};
$('stop').onclick=stop;
$('pause').onclick=function(){ if(!synth)return; if(!paused){synth.pause();paused=true;this.textContent='▶'} else {synth.resume();paused=false;this.textContent='⏸'} };
$('showrd').onchange=function(){document.body.classList.toggle('showrd',this.checked)};
$('shownt').onchange=function(){document.body.classList.toggle('shownt',this.checked)};
window.addEventListener('beforeunload',function(){if(synth)synth.cancel()});
})();
</script></body></html>
