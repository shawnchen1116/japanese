<script>const KJ='一-鿿々〇ヶ';
const reK=new RegExp('['+KJ+']');
const reKana=/^[ぁ-ゖァ-ヺー]+$/;
const kn=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
function subseq(S,R){R=kn(R);let j=0;for(const c of kn(S)){if(reK.test(c))continue;const k=R.indexOf(c,j);if(k<0)return false;j=k+1}return true}
function parse(str){
  const out=[];
  const parts=str.split(/(【[^】]*】)/);
  for(const p of parts){
    if(!p)continue;
    if(p[0]==='【'){out.push({t:'note',v:p.slice(1,-1)});continue}
    const re=/（([^）]*)）/g;let m,last=0,buf='';
    const flush=(s,o)=>{if(s)out.push(Object.assign({t:'txt',v:s},o||{}))};
    while((m=re.exec(p))){
      buf=p.slice(last,m.index);last=re.lastIndex;const c=m[1];
      if(reK.test(c)){ // kana-first
        const km=buf.match(/[ぁ-ゖ]+$/);
        if(km){flush(buf.slice(0,buf.length-km[0].length));out.push({t:'rd',base:c,r:km[0]});}
        else{flush(buf);out.push({t:'alt',v:'（'+c+'）'});}
      }else if(reKana.test(c)){
        const cm=buf.match(new RegExp('['+KJ+'ぁ-ゖァ-ヺー]+$'));
        let S=null;
        if(cm){const C=cm[0];for(let l=C.length;l>=1;l--){const s=C.slice(-l);if(reK.test(s)&&subseq(s,c)&&(reK.test(s[0])||/[おご]/.test(s[0]))){S=s;break}}}
        if(S){const pre=buf.slice(0,buf.length-S.length);
          if(/「ご」$/.test(pre)&&c[0]==='ご'){flush(pre.slice(0,-3));flush('「ご」',{ns:1})}else flush(pre);
          out.push({t:'rd',base:S,r:c});}
        else{flush(buf);out.push({t:'alt',v:'（'+c+'）'});}
      }else{flush(buf);out.push({t:'alt',v:'（'+c+'）'});}
    }
    flush(p.slice(last));
  }
  return out;
}
const OV=[['中国語','ちゅうごくご'],['中国人','ちゅうごくじん'],['日本人','にほんじん'],['日本語','にほんご'],['日本','にほん'],['中国','ちゅうごく'],['韓国','かんこく'],['北京','ぺきん'],['京都','きょうと'],['東京','とうきょう'],['奈良','なら'],['神戸','こうべ'],['大阪','おおさか'],['英語','えいご'],['紅葉','もみじ'],['私','わたし'],['昨日','きのう'],['今日','きょう'],['明日','あした'],['時々','ときどき'],['全然','ぜんぜん'],['趣味','しゅみ'],['息子','むすこ'],['四川','しせん'],['七時','しちじ'],['三か月','さんかげつ'],['お茶','おちゃ'],['お願い','おねがい'],['終わり','おわり'],['着ます','きます'],['始め','はじめ'],['初めて','はじめて'],['先に','さきに'],['寝坊','ねぼう'],['山田','やまだ'],['吉田','よしだ'],['長島','ながしま'],['森','もり'],['李','り'],['薬局','やっきょく']];
function speechOf(nodes){
  let s='';
  for(const n of nodes){if(n.t==='txt'&&!n.ns)s+=n.v;else if(n.t==='rd')s+=n.r}
  s=s.replace(/「(.)」/g,'$1').replace(/[→＞・\/]/g,'、').replace(/[「」]/g,'');
  s=s.replace(/方(?=が[\s　]*いい)/g,'ほう').replace(/方/g,'かた');
  for(const [a,b] of OV)s=s.split(a).join(b);
  return s.replace(/[\s　]+/g,'').replace(/〜/g,'').trim();
}
function plain(nodes){return nodes.map(n=>n.t==='txt'?n.v:n.t==='rd'?n.base:n.t==='alt'?n.v:'').join('')}
function items(nodes){
  const res=[];let cur=[];
  const push=()=>{if(cur.some(n=>(n.t==='txt'&&n.v.trim())||n.t==='rd'))res.push(cur);cur=[]};
  for(const n of nodes){
    if(n.t==='note')continue;
    if(n.t==='txt'){const ps=n.v.split(/[、，・]/);ps.forEach((p,i)=>{if(i>0)push();if(p)cur.push(Object.assign({},n,{v:p}))})}
    else cur.push(n);
  }
  push();return res;
}
function isVocab(raw,nodes){
  const t=nodes.filter(n=>n.t!=='note').map(n=>n.t==='txt'?n.v:n.t==='rd'?n.base:'').join('');
  if(!t.trim())return false;
  if(/[。？?→＞]/.test(t)||/[。？]/.test(raw.replace(/【[^】]*】/g,'')))return false;
  return true;
}
function lessons(src){
  const L=[];let cur=null;let tbl=null;
  const z=s=>s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
  for(let line of src.split('\n')){
    line=line.trim();
    if(!line){if(tbl){cur&&cur.lines.push(tbl);tbl=null}continue}
    let m;
    if((m=line.match(/^#\s*([０-９0-9]+)。/))){cur={n:+z(m[1]),lines:[]};L.push(cur);continue}
    if(line[0]==='#')continue;
    if(!cur)continue;
    if(line[0]==='|'){const cells=line.split('|').slice(1,-1).map(s=>s.trim());if(!tbl)tbl={table:[]};tbl.table.push(cells);continue}
    const nodes=parse(line);
    cur.lines.push({nodes,vocab:isVocab(line,nodes)});
  }
  if(tbl&&cur)cur.lines.push(tbl);
  return L;
}
function annotate(sent,pairs){
  const ps=pairs.filter(p=>p[0]).sort((a,b)=>b[0].length-a[0].length);
  if(!ps.length)return sent;
  const re=new RegExp('('+ps.map(p=>p[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?!（)','g');
  return sent.replace(re,(m,b)=>b+'（'+ps.find(p=>p[0]===b)[1]+'）');
}

(function(){
const $=s=>document.querySelector(s);
const SRC=$('#src').textContent;
const se=$('#sent');const EXP=!!se;
const sentMap=new Map();
if(se)se.textContent.trim().split('\n').forEach(l=>{const i=l.indexOf('=');if(i>0)sentMap.set(l.slice(0,i),l.slice(i+1))});
const units=[];const byLesson={};
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function render(nodes,into){
  for(const n of nodes){
    if(n.t==='txt')into.appendChild(document.createTextNode(n.v));
    else if(n.t==='rd'){const a=E('a','rd',n.base);a.dataset.r=n.r;a.tabIndex=0;a.setAttribute('role','button');into.appendChild(a)}

  }
}
function addUnit(el,speech,n){if(!speech)return;const u={el,speech,n};units.push(u);(byLesson[n]=byLesson[n]||[]).push(u);const b=el.querySelector('.pl');if(b)b.onclick=()=>play([u]);}
const main=$('#main'),nav=$('#nav');
for(const L of lessons(SRC)){
  const sec=E('section','les');sec.id='L'+L.n;
  const h=E('h2',null,'第'+L.n+'課');const pb=E('button','pl2','▶ このレッスン');pb.onclick=()=>play(byLesson[L.n]||[]);h.appendChild(pb);sec.appendChild(h);
  const a=E('a','chip',String(L.n));a.href='#L'+L.n;nav.appendChild(a);
  for(const ln of L.lines){
    if(ln.table){
      const t=E('table','tb');
      for(const r of ln.table){const tr=E('tr');const td0=E('td','c0');const b=E('button','pl','▶');td0.appendChild(b);tr.appendChild(td0);
        const sp=[];for(const c of r){tr.appendChild(E('td',null,c));if(/^[ぁ-ゖァ-ヺー・]+$/.test(c))sp.push(c.replace(/・/g,'、'))}
        t.appendChild(tr);addUnit(tr,sp.join('、'),L.n)}
      sec.appendChild(t);continue}
    const sp=speechOf(ln.nodes);
    const d=E('div',sp?'line':'lab');
    if(sp){d.appendChild(E('button','pl','▶'))}
    const tx=E('span','tx');render(ln.nodes,tx);d.appendChild(tx);sec.appendChild(d);
    addUnit(d,sp,L.n);
    if(EXP&&ln.vocab){
      const box=E('div','exs');
      const seen=new Set();
      for(const it of items(ln.nodes)){
        const key=L.n+'|'+plain(it);if(seen.has(key))continue;seen.add(key);
        const s=sentMap.get(key);if(!s)continue;
        const pairs=it.filter(n=>n.t==='rd').map(n=>[n.base,n.r]);
        const nodes=parse(annotate(s,pairs));
        const ex=E('div','ex');ex.appendChild(E('button','pl','▶'));ex.appendChild(E('span','w',plain(it).replace(/「|」/g,'')));
        const t2=E('span','tx');render(nodes,t2);ex.appendChild(t2);box.appendChild(ex);
        addUnit(ex,speechOf(nodes),L.n);

}
document.addEventListener('click',e=>{const a=e.target.closest('a.rd,a.nt');if(a){e.preventDefault();a.classList.toggle('on')}});

const synth=window.speechSynthesis;let token=0,cur=null,keep=null;
const vsel=$('#voice'),rsel=$('#rate'),st=$('#status');
function pref(k,v){try{if(v===undefined)return localStorage.getItem('jp_'+k);localStorage.setItem('jp_'+k,v)}catch(e){return null}}
function loadVoices(){
  if(!synth)return;const all=synth.getVoices();let ja=all.filter(v=>/^ja/i.test(v.lang));
  const prev=vsel.value||pref('voice');vsel.innerHTML='';
  if(!ja.length){vsel.appendChild(new Option('(標準の音声)',''));vsel.disabled=true;return}
  ja.forEach(v=>vsel.appendChild(new Option(v.name+' ('+v.lang+')',v.voiceURI)));
  if(prev&&ja.some(v=>v.voiceURI===prev))vsel.value=prev;

}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}else st.textContent='このブラウザは音声読み上げに対応していません。';
const r0=pref('rate');if(r0)rsel.value=r0;
rsel.onchange=()=>pref('rate',rsel.value);vsel.onchange=()=>pref('voice',vsel.value);
function mark(u){if(cur)cur.el.classList.remove('cur');cur=u;if(u){u.el.classList.add('cur');u.el.scrollIntoView({block:'center',behavior:'smooth'})}}
function play(list){
  if(!synth||!list.length)return;stop(true);const my=++token;let i=0;
  const next=()=>{
    if(my!==token)return;
    if(i>=list.length){mark(null);st.textContent='再生終了';return}
    const u=list[i++];mark(u);st.textContent='再生中 第'+u.n+'課';
    const ut=new SpeechSynthesisUtterance(u.speech);ut.lang='ja-JP';ut.rate=parseFloat(rsel.value)||0.6;

}
