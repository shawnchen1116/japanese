const DICT=Object.fromEntries("森=もり;小野=おの;長島=ながしま;吉田課長=よしだかちょう;吉田=よしだ;山田先生=やまだせんせい;山田=やまだ;李=り;四川=しせん;北京=ぺきん;神戸=こうべ;大阪=おおさか;東京=とうきょう;京都=きょうと;奈良=なら;韓国=かんこく;中国人=ちゅうごくじん;中国語=ちゅうごくご;中国=ちゅうごく;日本語=にほんご;日本人=にほんじん;日本=にほん;北海道=ほっかいどう;私=わたし;昨日=きのう;今日=きょう;明日=あした;今朝=けさ;今年=ことし;今度=こんど;今週=こんしゅう;毎朝=まいあさ;毎晩=まいばん;毎日=まいにち;友達=ともだち;部屋=へや;電話番号=でんわばんごう;電話=でんわ;一緒=いっしょ;一番好=いちばんす;一番=いちばん;時々=ときどき;全然=ぜんぜん;趣味=しゅみ;息子=むすこ;七時=しちじ;八時=はちじ;十時=じゅうじ;一時間=いちじかん;何時=なんじ;三か月=さんかげつ;七歳=ななさい;何歳=なんさい;四百二十円=よんひゃくにじゅうえん;二十万円=にじゅうまんえん;寝坊=ねぼう;初めて=はじめて;始め=はじめ;終わり=おわり;お茶=おちゃ;お願い=おねがい;皆さん=みなさん;出張中=しゅっちょうちゅう;上手=じょうず;下手=へた;苦手=にがて;風邪=かぜ;大丈夫=だいじょうぶ;以外=いがい;土産=みやげ;浴衣=ゆかた;辞書=じしょ;手紙=てがみ;新聞=しんぶん;会社=かいしゃ;子供=こども;昼ご飯=ひるごはん;名前=なまえ;野菜=やさい;仕事=しごと;時間=じかん;散歩=さんぽ;公園=こうえん;先生=せんせい;元気=げんき;学生=がくせい;切手=きって;餃子=ぎょうざ;書道=しょどう;面白い=おもしろい;試験=しけん;電車=でんしゃ;動物園=どうぶつえん;卵=たまご;机=つくえ;緑茶=りょくちゃ;猫=ねこ;郵便局=ゆうびんきょく;午後=ごご;肉=にく;魚=さかな;英語=えいご;牛乳=ぎゅうにゅう;結婚式=けっこんしき;料理=りょうり;赤い=あかい;有名=ゆうめい;静か=しずか;町=まち;綺麗=きれい;便利=べんり;不便=ふべん;傘=かさ;駅前=えきまえ;駅=えき;庭=にわ;誰=だれ;航空便=こうくうびん;旅行会社=りょこうがいしゃ;旅行=りょこう;少し=すこし;洋服=ようふく;映画=えいが;電気=でんき;写真=しゃしん;窓=まど;本=ほん;車=くるま;水=みず;飛行機=ひこうき;自動車=じどうしゃ;病院=びょういん;病気=びょうき;社員=しゃいん;頭=あたま;酒=さけ;鍵=かぎ;狭=せま;広=ひろ;甘=あま;長=なが;背=せ;脚=あし;皆=みな;医者=いしゃ;携帯電話=けいたいでんわ;音楽=おんがく;山=やま;海=うみ;川=かわ;月=つき;花=はな;星=ほし;木=き;空=そら;雪=ゆき;雨=あめ;犬=いぬ".split(';').map(x=>x.split('=')));
const KEYS=Object.keys(DICT).sort((a,b)=>b.length-a.length);
const KJ='一-鿿々〆',KA='ぁ-んァ-ヶー';
const hasK=s=>new RegExp('['+KJ+']').test(s);
const rxe=c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function seg(line){
 const out=[];
 for(const p of line.split(/(【[^】]*】)/)){
  if(!p)continue;
  if(p[0]==='【'){out.push(['n',p]);continue;}
  let pos=0;const re=/（([^）]*)）/g;let m;
  while((m=re.exec(p))){
   const pre=p.slice(pos,m.index),y=m[1];let best=null;
   for(let k=Math.min(pre.length,10);k>0;k--){
    const S=pre.slice(-k);
    if(!new RegExp('^['+KJ+KA+']+$').test(S)||!hasK(S))continue;
    const rx=[...S].map(c=>new RegExp('['+KJ+']').test(c)?'.+?':rxe(c)).join('');
    if(new RegExp('^'+rx+'$').test(y)){best=S;break;}
   }
   if(best===null){const mm=pre.match(new RegExp('['+KJ+']+$'));best=mm?mm[0]:'';}
   if(best){const b=pre.slice(0,pre.length-best.length);if(b)out.push(['t',b]);out.push(['r',best,y]);}
   else{out.push(['t',pre]);out.push(['t','（'+y+'）']);}
   pos=m.index+m[0].length;
  }
  if(p.slice(pos))out.push(['t',p.slice(pos)]);
 }
 return out;
}
function spT(t){
 for(const k of KEYS)t=t.split(k).join(DICT[k]);
 t=t.replace(/(あの|どの)方/g,'$1かた');
 if(/話し方|読み方|作り方|やり方|使い方/.test(t))t=t.replace(/(?<=[しみりい])方/g,'かた');
 t=t.replace(/方/g,'ほう');
 t=t.replace(/何(?=[がをもでか])/g,'なに').replace(/何/g,'なん');
 t=t.replace(/上(?=[にをがで])/g,'うえ').replace(/後(?=で)/g,'あと').replace(/家(?=[をへに])/g,'いえ');
 t=t.replace(/今(?![年日朝週月度夜])/g,'いま').replace(/分かり/g,'わかり').replace(/分からな/g,'わからな');
 return t;
}
function speech(toks){
 let s='';
 for(const t of toks){if(t[0]==='n')continue;s+=t[0]==='r'?t[2]:spT(t[1]);}
 s=s.replace(/^[\d./ ]+→\s*/,'').replace(/(?<!いらっしゃい)「[^」]*」/g,'').replace(/・/g,'、');
 s=s.replace(/→/g,'、').replace(/\//g,'、').replace(/＞/g,'、').replace(/〜/g,'').replace(/[「」]/g,'').replace(/…/g,'。').replace(/　/g,' ');
 return s.replace(/\s+/g,' ').trim();
}
const plain=s=>s.replace(/【[^】]*】/g,'').replace(/（[^）]*）/g,'').trim();
const isVocab=ln=>{const s=ln.replace(/【[^】]*】/g,'');return s.trim()&&!/[。？！→＞]/.test(s)&&!/^[\d./ ]+$/.test(s);};
function vitems(ln){let s=ln;if(/^【[^】]*】[^、]/.test(s))s=s.replace(/^【[^】]*】/,'');
 const o=[];for(const p of s.split('、'))for(const q of p.trim().split('・')){const z=q.trim();if(plain(z))o.push(z);}return o;}
const DATA=[];
SRC.split('\n').forEach(ln=>{ln=ln.trim();if(!ln)return;
 if(ln[0]==='#'){DATA.push({n:+ln.slice(1),o:[],p:[],v:[]});return;}
 const L=DATA[DATA.length-1],t=seg(ln);
 L.o.push({k:'o',t:t,s:speech(t)});if(isVocab(ln))L.v.push(...vitems(ln));});
{let c=null,ptr=0;
 PRAC.split('\n').forEach(ln=>{ln=ln.trim();if(!ln)return;
  if(ln[0]==='#'){c=DATA[+ln.slice(1)-1];ptr=0;return;}
  const i=ln.indexOf('｜'),k=ln.slice(0,i),v=ln.slice(i+1);
  let lab=k;if(ptr<c.v.length&&plain(c.v[ptr])===k)lab=c.v[ptr++];
  const w=seg(lab),t=seg(v);
  c.p.push({k:'p',w:w,t:t,s:(speech(w)+'。'+speech(t)).trim()});});}
const $=s=>document.querySelector(s);

 if(t[0]==='t')return esc(t[1]);

const items=[];const m=$('#m');
DATA.forEach(L=>{

  const d=document.createElement('div');

  }else{

function stop(){tok++;playing=false;paused=false;q=[];pos=0;if('speechSynthesis' in window)speechSynthesis.cancel();mark(null);$('#st').textContent='';$('#pz').textContent='⏸';$('#pz').classList.remove('on');}
function start(list){stop();if(!list.length)return;q=list;pos=0;playing=true;say();}
function say(){
 if(!playing||paused)return;
 if(pos>=q.length){stop();return;}
 const i=q[pos],it=items[i];mark(i);
 const my=++tok;
