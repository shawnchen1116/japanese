const NUM={"420円":"よんひゃくにじゅうえん","20万円":"にじゅうまんえん","2頭（にとう）":"にとう"};
const OVR={"引き出し（ひきだし）":"ひきだし","入り口（いりぐち）":"いりぐち","打ち合わせ（うちあわせ）":"うちあわせ","唐揚げ（からあげ）":"からあげ","焼き鳥（やきとり）":"やきとり","一人暮らし（ひとりぐらし）":"ひとりぐらし","買い物します":"かいものします","気に入（い）りました":"きにいりました","切符売（きっぷう）り場（ば）":"きっぷうりば","三が日（さんがにち）":"さんがにち","一か月（いっかげつ）":"いっかげつ","女の子（おんなのこ）":"おんなのこ","子供のひ（こどものひ）":"こどものひ"};
function speak(s){
 s=s.replace(/【[^】]*】/g,'');
 for(const k in NUM)s=s.split(k).join(NUM[k]);
 for(const k in OVR)s=s.split(k).join(OVR[k]);
 s=s.replace(/[「」]/g,'');
 s=s.replace(/(お|ご)?([一-龥々]+[ぁ-ん]*)（([ぁ-んァ-ンー]+)）/g,(m,p,k,r)=>(p&&!r.startsWith(p))?p+r:r);
 s=s.replace(/（[^）]*[一-龥々][^）]*）/g,'');
 s=s.replace(/（([^）]*)）/g,'、$1');
 s=s.replace(/[〜～>＞→\/・，]/g,'、').split('、、').join('、');
 for(const [a,b] of MP)s=s.split(a).join(b);
 s=s.replace(/　/g,' ').replace(/\s+/g,' ').replace(/^[ 、]+|[ 、]+$/g,'');
 return s;}
const DATA=RAW.map(([n,it])=>({n,items:it.map(x=>x[0]==='~'?{t:'w',d:x[1],s:speak(x[1]),e:x[2],es:speak(x[2])}:{t:'L',d:x[0],s:speak(x[1]||x[0])})}));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let gen=0,paused=false,voices=[];
const vo=document.getElementById('vo'),st=document.getElementById('st');
function loadVoices(){
 const cur=vo.value;
 voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
 vo.innerHTML='';
 if(!voices.length){vo.innerHTML='<option value="">Browser default</option>';st.textContent='No Japanese voice found – using browser default';return;}
 voices.forEach((v,i)=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+v.lang+')';vo.appendChild(o);});
 const pref=voices.find(v=>/google|kyoko|o-ren|haruka|nanami/i.test(v.name))||voices[0];
 vo.value=(cur&&voices.some(v=>v.name===cur))?cur:pref.name;
 st.textContent=voices.length+' voice(s)';
}
loadVoices();speechSynthesis.onvoiceschanged=loadVoices;
const rate=()=>parseFloat(document.getElementById('sp').value);
function say(t){return new Promise(res=>{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';
 const v=voices.find(x=>x.name===vo.value);if(v)u.voice=v;u.rate=rate();u.onend=res;u.onerror=res;speechSynthesis.speak(u);});}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function clearOn(){document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));}
async function playList(ids){
 stopAll();const my=++gen;
 for(const id of ids){
  if(my!==gen)return;
  const e=document.getElementById(id);clearOn();e.classList.add('on');
  e.scrollIntoView({block:'center',behavior:'smooth'});
  for(const p of JSON.parse(e.dataset.p)){
   if(my!==gen)return;await say(p);if(my!==gen)return;await sleep(400/rate()*0.7);}
  await sleep(300);
 }
 if(my===gen)clearOn();
}
function stopAll(){gen++;speechSynthesis.cancel();speechSynthesis.resume();paused=false;document.getElementById('pause').textContent='⏸ Pause';clearOn();}
const m=document.getElementById('m'),jump=document.getElementById('jump');
DATA.forEach(l=>{
 const sec=document.createElement('section');sec.className='lesson';sec.id='les'+l.n;
 const ids=[];
 let h=`<div class="lh"><h2>第${l.n}課 / Lesson ${l.n}</h2><button class="p" data-les="${l.n}">▶ Play lesson</button></div>`;
 l.items.forEach((it,i)=>{
  const id=`l${l.n}_${i}`;ids.push(id);
  const parts=it.t==='w'?[it.s,it.es]:[it.s];
  const body=it.t==='w'?`<div><div class="tx">${esc(it.d)}</div><div class="ex">${esc(it.e)}</div></div>`:`<div class="tx">${esc(it.d)}</div>`;
  h+=`<div class="ln ${it.t==='w'?'w':''}" id="${id}" data-p='${JSON.stringify(parts).replace(/'/g,'&#39;')}'><button class="b" data-id="${id}">▶</button>${body}</div>`;
 });
 sec.innerHTML=h;sec.dataset.ids=JSON.stringify(ids);m.appendChild(sec);
 const o=document.createElement('option');o.value=l.n;o.textContent='Lesson '+l.n;jump.appendChild(o);
});
m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.id)playList([b.dataset.id]);
 else if(b.dataset.les)playList(JSON.parse(b.closest('section').dataset.ids));});

document.getElementById('pause').onclick=function(){if(paused){speechSynthesis.resume();paused=false;this.textContent='⏸ Pause';}else{speechSynthesis.pause();paused=true;this.textContent='▶ Resume';}};
