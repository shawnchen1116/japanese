function speak_text(s){
 s=s.replace(/【[^】]*】/g,'').replace(/[「」]/g,'');
 s=s.replace(/(\d+)頭/g,'二頭');
 s=s.replace(/([おご]?)([一-龥々][一-龥々ぁ-ん]*)（([ぁ-んァ-ンー]+)）/g,(m,p,k,r)=>(p&&r.startsWith(p))?r:p+r);
 s=s.replace(/（[^）]*[一-龥][^）]*）/g,'');
 s=s.replace(/（([^）]*)）/g,'、$1');
 s=s.replace(/[〜~]/g,'').replace(/[＞→\/]/g,'、').replace(/・/g,'、');
 for(const [a,b] of MAP) s=s.split(a).join(b);
 return s.replace(/　/g,' ').trim();
}
function es_text(d,e){
 const w=d.replace(/[「」]/g,'');
 const m=w.match(/^([一-龥々ぁ-ん]+)（([ぁ-んァ-ンー]+)）$/)||w.match(/^([一-龥々])（([ぁ-んー]+)）[ぁ-んァ-ン]*$/);
 if(m&&/[一-龥]/.test(m[1])){const re=new RegExp('(?<![一-龥々])'+m[1]+'(?![一-龥々（])');return e.replace(re,m[2]);}
 return e;}

 stopAll();const my=++gen;playing=true;
 for(const id of ids){ if(my!==gen)return;
  const e=document.getElementById(id);document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));e.classList.add('on');e.scrollIntoView({block:'center',behavior:'smooth'});
  const parts=JSON.parse(e.dataset.p);
  for(const p of parts){ if(my!==gen)return; await say(p); if(my!==gen)return; await sleep(350/rate()*0.7);}
  await sleep(300);
 }
 if(my===gen){document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));playing=false;}
}
function stopAll(){gen++;speechSynthesis.cancel();speechSynthesis.resume();paused=false;playing=false;document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));}
const main=document.getElementById('m');
DATA.forEach(l=>{
 const sec=document.createElement('section');sec.className='lesson';
 const ids=[];
 let h=`<div class="lh"><h2>${TITLE_PREFIX}${l.n}課 / Lesson ${l.n}</h2><button class="p" data-les="${l.n}">▶ Play lesson</button></div>`;
 l.items.forEach((it,i)=>{
  const id=`l${l.n}_${i}`;ids.push(id);
  let parts,html;
  if(it.t==='L'){parts=[speak_text(it.s||it.d)];html=`<div class="tx">${it.d}</div>`;}
  else{parts=[speak_text(it.s||it.d),speak_text(es_text(it.d,it.e))];html=`<div><div class="tx">${it.d}</div><div class="ex">${it.e}</div></div>`;}
  h+=`<div class="ln ${it.t==='w'?'w':''}" id="${id}" data-p='${JSON.stringify(parts).replace(/'/g,"&#39;")}'><button class="b" data-id="${id}">▶</button>${html}</div>`;
 });
 sec.innerHTML=h;sec.dataset.ids=JSON.stringify(ids);main.appendChild(sec);
});
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.id)playList([b.dataset.id]);
 else if(b.dataset.les)playList(JSON.parse(b.closest('section').dataset.ids));});
document.getElementById('all').onclick=()=>playList([...document.querySelectorAll('.lesson')].flatMap(s=>JSON.parse(s.dataset.ids)));
document.getElementById('stop').onclick=stopAll;
document.getElementById('pause').onclick=function(){if(paused){speechSynthesis.resume();paused=false;this.textContent='⏸ Pause';}else{speechSynthesis.pause();paused=true;this.textContent='▶ Resume';}};
pickVoice();
</script></body></html>
