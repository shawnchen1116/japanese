<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本語オーディオ</title>
<style>
:root{--bg:#fbfaf7;--fg:#1f2430;--mut:#6b7280;--acc:#b4332e;--line:#e6e2d9;--card:#fff;--hl:#fff1c9;--pill:#eef2ff;--pillfg:#3b4cca;--note:#f4f1ea}
@media(prefers-color-scheme:dark){:root{--bg:#14161b;--fg:#e8e6e1;--mut:#9aa0ab;--acc:#ff8a80;--line:#2a2e37;--card:#1b1e25;--hl:#3a3320;--pill:#262c4a;--pillfg:#a9b6ff;--note:#22252d}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.75 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif}
#bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
#bar button,#bar select{font:inherit;font-size:13px;line-height:1.2;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
#bar select{width:68px;padding:0 2px}#spd{width:62px}
#bar button.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;padding:0 9px}
#bar button.on{background:var(--pill);color:var(--pillfg)}
#msg{font-size:12px;color:var(--mut);flex-basis:100%}
main{max-width:760px;margin:0 auto;padding:4px 12px 80px}
h2{display:flex;align-items:center;gap:8px;margin:26px 0 6px;font-size:19px;scroll-margin-top:60px}
h3{margin:14px 0 2px;font-size:15px;color:var(--mut);font-weight:600}
.row{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:8px;scroll-margin-top:90px}
.row.cur{background:var(--hl)}
.row .c{flex:1;min-width:0;overflow-wrap:anywhere}
.row .sub{display:block;color:var(--mut);font-size:15px;line-height:1.7}
.row.w .main{font-weight:600}
.row.g .main{font-weight:700;color:var(--acc)}
.row.ex{margin-left:18px}
.sp{height:8px}
.pb{flex:none;width:28px;height:28px;margin-top:3px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--acc);font-size:11px;line-height:1;padding:0;cursor:pointer}
.rb{cursor:pointer;color:var(--fg);border-bottom:1.5px dotted var(--acc)}
.rb.on::after,.all .rb::after{content:"（" attr(data-r) "）";color:var(--acc);font-size:.82em}
.nt{display:inline-block;cursor:pointer;margin:0 3px;padding:0 7px;font-size:12px;line-height:1.6;border-radius:9px;background:var(--pill);color:var(--pillfg);vertical-align:2px;user-select:none}
.ntx{display:none;color:var(--mut);font-size:.88em;font-weight:400}
.ntx.on,.all .ntx{display:inline}
.ntx.long.on,.all .ntx.long{display:block;margin:4px 0 6px;padding:8px 10px;background:var(--note);border-radius:8px;line-height:1.65}
</style>
</head>
<body>
<div id="bar">
<button id="play" class="main" type="button">▶ All</button>
<button id="stop" type="button" aria-label="Stop">■</button>
<select id="spd" aria-label="Speed"><option value="0.6">Slow</option><option value="0.9">Normal</option><option value="1.2">Fast</option></select>
<select id="voice" aria-label="Voice" hidden></select>
<select id="jump" aria-label="Go to"></select>
<button id="show" type="button">Show</button>
<div id="msg" hidden></div>
</div>

w	まとめて【汇总；集中在一起。】	{荷物|にもつ}を　まとめて　{送|おく}ります。
w	さらに【更加；进而（程度进一步加深）。】	{天気|てんき}は　さらに　{悪|わる}く　なりました。
w	もっと【更；再（比现在程度更高）。】	もっと　{野菜|やさい}を　{食|た}べて　ください。
w	{間|ま}もなく【不久；即将（多用于广播或正式场合）。】	{間|ま}もなく　{電車|でんしゃ}が　{来|き}ます。
w	もうすぐ【马上；很快（比間もなく更口语）。】	もうすぐ　{春|はる}ですね。
w	やっと【终于；好不容易（经过努力或等待之后）。】	やっと　{宿題|しゅくだい}が　{終|お}わりました。
w	{初|はじ}めて【第一次；初次。】	{初|はじ}めて　{日本|にほん}へ　{来|き}ました。
w	{先に|さきに}【先；在～之前（お先に失礼します＝我先走了）。】	{先に|さきに}　{食|た}べて　ください。
w	だいぶ【①相当；颇（程度、数量很可观）。】	{昨日|きのう}は　だいぶ　{お酒|おさけ}を　{飲|の}みました。
w	だいぶ【②好多了（病情、状况明显改善，常与良くなりました连用）。】	{風邪|かぜ}は　だいぶ　{良|よ}く　なりました。
w	{何度|なんど}も【好多次；多次。】	{何度|なんど}も　{同|おな}じ　{話|はなし}を　{聞|き}きました。
w	そんなに【那么（程度不像预想的那样，多用于否定）。】	そんなに　{高|たか}くないですよ。
w	まあまあ【还可以；还算过得去；一般。】	{試験|しけん}は　まあまあ　できました。
w	たぶん【大概；也许（推测，后面常接でしょう／だろう）。】	たぶん　{明日|あした}は　{雨|あめ}でしょう。
w	いろいろ【各种各样；许多种。】	{店|みせ}には　いろいろ　あります。
w	とうとう【终于；终究（长期等待或经过之后最后发生）。】	とうとう　お{別|わか}れですね。
w	{必|かなら}ず【一定；务必（必须做，或必然发生）。】	{明日|あした}　{必|かなら}ず　{電話|でんわ}して　ください。
w	{絶対|ぜったい}に【①绝对（绝对に＋否定＝绝对不～）。】	{絶対|ぜったい}に　{行|い}きません。
w	{絶対|ぜったい}に【②一定；务必（绝对に＋肯定，表示强烈的要求）。】	{明日|あした}は　{絶対|ぜったい}に　{来|き}て　ください。
w	{一緒|いっしょ}に【一起；一同。】	{一緒|いっしょ}に　{昼|ひる}{ご飯|ごはん}を　{食|た}べませんか。
w	{結構|けっこう}【①相当；挺（程度副词，口语）。】	この　{料理|りょうり}は　{結構|けっこう}　{美味|おい}しいです。
w	{結構|けっこう}【②（結構です）不用了；可以（委婉拒绝或表示同意）。】	{お茶|おちゃ}は　もう　{結構|けっこう}です。
w	{早|はや}く【快点；早点（い形容词“早い”的副词形）。】	{明日|あした}は　{早|はや}く　{起|お}きて　ください。
w	まっすぐ【①笔直地；一直（方向）。】	この{道|みち}を　まっすぐ　{行|い}って　ください。
w	まっすぐ【②径直；直接（中途不绕路）。】	{今日|きょう}は　まっすぐ　{家|いえ}へ　{帰|かえ}ります。
w	たしか【我记得；好像是（对记忆不太有把握）。】	あの{人|ひと}は　たしか　{李|り}さんの　{お兄|おにい}さんです。
h	接続詞
w	そして【①而且；并且（叠加、并列）。】	{京都|きょうと}は　{静|しず}かです。そして、きれいです。
w	そして【②然后（动作的先后顺序）。】	{朝|あさ}　{ご飯|ごはん}を　{食|た}べました。そして、{学校|がっこう}へ　{行|い}きました。
w	でも【可是；但是（逆接，口语）。】	この{料理|りょうり}は　{安|やす}いです。でも、{美味|おい}しいです。
w	ところで【对了；话说回来（转换话题）。】	ところで、{明日|あした}の　{会議|かいぎ}は　{何時|なんじ}からですか。
w	だから【所以（说明理由，口语）。】	{雨|あめ}が　{降|ふ}っています。だから、{出|で}かけません。
w	ですから【所以（だから的礼貌说法）。】	{熱|ねつ}が　あります。ですから、{今日|きょう}は　{休み|やすみ}ます。
w	じゃあ【①那么（承接对方的话，得出结论或提议）。】	{雨|あめ}ですか。じゃあ、{家|いえ}で　{映画|えいが}を　{見|み}ましょう。
w	じゃあ【②那么（告别、结束话题时）。】	じゃあ、また　{明日|あした}。
w	それとも【还是；或者（二选一的疑问）。】	{お茶|おちゃ}ですか、それとも　コーヒーですか。
w	また【①再；又（同一动作再次发生）。】	また　{来週|らいしゅう}　{会|あ}いましょう。
w	また【②还有；另外（并列、追加，句首使用）。】	ここでは　{野菜|やさい}が　{買|か}えます。また、{果物|くだもの}も　{買|か}えます。
#G
h	Lesson 11
g	{名詞|めいし} や {名詞|めいし}（など）【(第11课) “A和B（等等）”，列举代表性的事物，暗示还有其他的。と是完全列举，や是不完全列举。】
s	{机|つくえ}の{上|うえ}に　{本|ほん}や　ノートが　あります。【桌子上有书和笔记本等。】
s	{果物|くだもの}は　りんごや　みかんなどが　{好|す}きです。【水果我喜欢苹果、橘子之类的。】
g	～から【(第11课) “因为～所以～”。接在句子（敬体或简体）后面说明理由。后半句是结果。回答“どうして”时常用“～から”。】
s	{疲|つか}れましたから、{早|はや}く　{寝|ね}ます。【因为累了，所以早点睡。】
s	どうして　{来|き}ませんか。{忙|いそが}しいですから。【为什么不来？因为很忙。】
g	{名詞|めいし} が {好|す}きです／{上手|じょうず}です／できます【(第11课) 表示喜好、擅长、能力的对象时，用“が”而不用“を”。】
s	{私|わたし}は　{音楽|おんがく}が　{好|す}きです。【我喜欢音乐。】
s	{李|り}さんは　{料理|りょうり}が　{上手|じょうず}です。【小李擅长做菜。】
g	～は いかがですか／どうですか【(第11课) 劝请对方时的说法。“いかが”比“どう”更礼貌。拒绝时可以说“結構です”。】
s	コーヒーは　いかがですか。【来杯咖啡怎么样？】
s	{今|いま}は　{結構|けっこう}です。【现在不用了。】
h	Lesson 12
g	AはBより～です【(第12课) 比较句：“A比B～”。より前面是比较的基准。程度大时可加“ずっと”。】
s	{李|り}さんは　{森|もり}さんより　{若|わか}いです。【小李比森先生年轻。】
s	{冬|ふゆ}の{北京|ぺきん}は　{東京|とうきょう}より　ずっと　{寒|さむ}いです。【冬天的北京比东京冷得多。】
g	AよりBの{方|ほう}が～です【(第12课) “与A相比，B更～”。把想强调的B放在主语的位置，用“の方が”。】
s	{日本|にほん}より　{中国|ちゅうごく}の{方|ほう}が　{広|ひろ}いです。【与日本相比，中国更大。】
s	{私|わたし}は　{肉|にく}より　{魚|さかな}の{方|ほう}が　いいです。【比起肉，我更喜欢鱼。】
g	AはBほど～ません【(第12课) “A不如B那么～”。ほど后面一定要接否定。】
s	{神戸|こうべ}は　{大阪|おおさか}ほど　にぎやかでは　ありません。【神户不如大阪热闹。】
s	{今日|きょう}は　{昨日|きのう}ほど　{寒|さむ}くないです。【今天不如昨天冷。】
g	AとBと どちらが～ですか【(第12课) 在两者之间选择的疑问句。回答用“Aの方が～です”。三者以上用“どれ”，东西不明时可用口语“どっち”。】
s	{日本語|にほんご}と　{英語|えいご}と　どちらが　{難|むずか}しいですか。【日语和英语哪个难？】
s	{日本語|にほんご}の{方|ほう}が　{難|むずか}しいです。【日语更难。】
g	～の{中|なか}で～が {一番|いちばん}～です【(第12课) “在～之中，～最～”。范围用“の中で”，疑问词随范围而变：何、いつ、誰、どこ。】
s	{季節|きせつ}の{中|なか}で　いつが　{一番|いちばん}　{好|す}きですか。【四季之中你最喜欢什么时候？】
s	{春|はる}が　{一番|いちばん}　{好|す}きです。【我最喜欢春天。】
h	Lesson 13
g	{数詞|すうし}＋{助数詞|じょすうし}（{個|こ}・{枚|まい}・{冊|さつ}・{杯|はい}・{台|だい}・{本|ほん}・{人|にん}・{匹|ひき}・{頭|とう}）【(第13课) 数量词放在助数词前，位置在“を／が”之后、动词之前。数量词后不加助词。个：個，薄物：枚，书：冊，饮料：杯，机器车辆：台，细长物：本，人：人，小动物：匹，大动物：頭。】
s	{卵|たまご}を　{三個|さんこ}　{買|か}いました。【买了三个鸡蛋。】
s	{緑茶|りょくちゃ}を　{二杯|にはい}　{飲|の}みました。【喝了两杯绿茶。】
g	{期間|きかん}に {回数|かいすう}【(第13课) “在一段时间内几次”，用“期间＋に＋次数”表示频率。】
s	{李|り}さんは　{一週間|いっしゅうかん}に　{二回|にかい}　プールへ　{行|い}きます。【小李一周去两次游泳池。】
s	{一か月|いっかげつ}に　{一回|いっかい}　{映画|えいが}を　{見|み}ます。【我一个月看一次电影。】
g	～ぐらい／どのぐらい【(第13课) “大约～”，接在数量词后。“どのぐらい”询问需要的时间或数量。】
s	{会社|かいしゃ}まで　どのぐらい　かかりますか。【到公司要花多长时间？】
s	{電車|でんしゃ}で　{一時間|いちじかん}ぐらい　かかります。【坐电车要一个小时左右。】
g	{動詞|どうし}ます{形|けい}（ます）＋に {行|い}きます／{来|き}ます【(第13课) 表示移动的目的。动词去掉“ます”后加“に”，后接“行きます／来ます／帰ります”。】
s	{本|ほん}を　{借|か}りに　{図書館|としょかん}へ　{行|い}きます。【去图书馆借书。】
s	{泳|およ}ぎに　{行|い}きます。【去游泳。】
g	{数量|すうりょう}＋で～{円|えん}です【(第13课) “で”表示合计、总额，“一共～日元”。】

s	{全部|ぜんぶ}で　{千円|せんえん}です。【一共一千日元。】
h	Lesson 14
g	て{形|けい}の{作|つく}り{方|かた}【(第14课) 动词て形。动1：く→いて（行く→行って 是例外）、ぐ→いで、む・ぶ・ぬ→んで、る・う・つ→って、す→して。动2：去掉ます加て。动3：来ます→来て，します→して。】
s	{書|か}きます→{書|か}いて、{読|よ}みます→{読|よ}んで、{待|ま}ちます→{待|ま}って【“写、读、等”的て形。】
s	{食|た}べます→{食|た}べて、{来|き}ます→{来|き}て、します→して【“吃、来、做”的て形。】

s	ここに　{住所|じゅうしょ}と　{名前|なまえ}を　{書|か}いて　ください。【请在这里写上地址和姓名。】
s	ここに　{住所|じゅうしょ}と　{名前|なまえ}を　{書|か}いて　くださいませんか。【能请您在这里写上地址和姓名吗？】
g	～てから、～【(第14课) “做完～之后再～”，强调先后顺序。】
s	{毎晩|まいばん}　ラジオを　{聞|き}いてから　{寝|ね}ます。【每天晚上听完广播再睡觉。】
s	{昼|ひる}{ご飯|ごはん}を　{食|た}べてから　{出|で}かけます。【吃完午饭再出门。】
g	{場所|ばしょ}を {通|とお}ります／{出|で}ます／{渡|わた}ります【(第14课) 表示经过或离开某个场所时，场所用“を”。】
s	{毎朝|まいあさ}　{七時|しちじ}に　{家|いえ}を　{出|で}ます。【每天早上七点出门。】
s	{駅前|えきまえ}を　{通|とお}ります。【经过车站前面。】
g	～ましょうか／～てください（そうしてください）【(第14课) 对话中征求对方意见：“～ますか。”“ええ、そうして ください。”＝“好的，请这样做。”】
s	{暗|くら}いですね。{電気|でんき}を　つけますか。【有点暗啊。要开灯吗？】
s	ええ、そうして　ください。【好的，请开吧。】
h	Lesson 15
g	～ても いいです【(第15课) “可以～”。询问许可用“～てもいいですか”，拒绝时委婉地说“それは ちょっと…”。】

s	もちろん　{休|やす}んでも　いいです。【当然可以休息。】

s	{飛行機|ひこうき}の{中|なか}で　タバコを　{吸|す}っては　いけません。【飞机上不可以吸烟。】
s	{無理|むり}を　しては　いけませんよ。【不可以勉强啊。】
g	～て います【(第15课) ①正在做某事：今 歩いています。②状态持续：持っています、住んでいます、知っています。③反复进行的习惯。】

s	{森|もり}さんは　{車|くるま}を　{持|も}って　います。【森先生有车。】
g	お＋ます{形|けい}＋ください【(第15课) 尊敬语的请求句型，比“～てください”更礼貌。例：お入りください、お伝えください。】

s	どうぞ　よろしく　お{伝|つた}え　ください。【请代为问候。】
g	お{大事|だいじ}に して ください【(第15课) 对生病的人说的惯用语，表示“请多保重身体”。“お＋名词”表示对对方的敬意。】
s	どうぞ　お{大事|だいじ}に　して　ください。【请多保重身体。】
s	ゆっくり　{休|やす}んで　ください。【请好好休息。】
h	Lesson 16
g	い{形容詞|けいようし}（～く）て／{形容動詞|けいようどうし}・{名詞|めいし} で【(第16课) 连接两个形容词或名词，表示并列。い形容词：去い加くて；な形容词、名词：加で。】

s	この　コンピューターの　{操作|そうさ}は　{簡単|かんたん}で　{便利|べんり}です。【这台电脑操作简单又方便。】
g	{動詞|どうし}て{形|けい}で {動作|どうさ}をつなぐ【(第16课) 用て形把几个动作按先后顺序连接起来，句末动词决定时态。】
s	{朝|あさ}　{起|お}きて、{顔|かお}を　{洗|あら}って、{ご飯|ごはん}を　{食|た}べます。【早上起床、洗脸、吃饭。】
s	{駅|えき}で　{電車|でんしゃ}に　{乗|の}って、{会社|かいしゃ}へ　{行|い}きます。【在车站乘电车去公司。】
g	～が、～【(第16课) “虽然～但是～”。“が”接在句尾，表示前后内容相反。也可以用来客气地铺垫。】
s	{三か月|さんかげつ}　パソコンを　{練習|れんしゅう}しましたが、まだ　あまり　できません。【练习了三个月电脑，但是还不太会。】
s	すみませんが、{駅|えき}は　どこですか。【不好意思，请问车站在哪里？】
g	AはBがCです【(第16课) “A（大主题）的B（部分）是C”，用于描述外貌、性格或特征。】
s	{森|もり}さんは　{背|せ}が　{高|たか}くて、{脚|あし}が　{長い|ながい}です。【森先生个子高，腿长。】
s	{象|ぞう}は　{鼻|はな}が　{長い|ながい}です。【大象的鼻子长。】
g	～て います（{知|し}っています／{住|す}んでいます）【(第16课) 知道：“知っています”，不知道：“知りません”（不用“知っていません”）。居住：“住んでいます”。】
s	{長島|ながしま}さんは　どこに　{住|す}んで　いますか。【长岛先生住在哪里？】
s	{李|り}さんを　{知|し}って　いますか。【你认识小李吗？】
h	Lesson 17
g	{名詞|めいし} が {欲|ほ}しいです【(第17课) “想要～”。想要的东西用“が”。否定：“欲しくないです”。】
s	{洋服|ようふく}が　{欲|ほ}しいです。【我想要一件衣服。】

var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var main=$('m'),jump=$('jump');
var RE=/\{([^|}]*)\|([^}]*)\}|【([^】]*)】/g;
function frag(t){var f=document.createDocumentFragment(),last=0,m;RE.lastIndex=0;
 while((m=RE.exec(t))){if(m.index>last)f.appendChild(document.createTextNode(t.slice(last,m.index)));
  if(m[3]!==undefined){var b=document.createElement('span');b.className='nt';b.textContent='注';b.setAttribute('role','button');b.tabIndex=0;
   var x=document.createElement('span');x.className='ntx'+(m[3].length>30?' long':'');x.textContent='【'+m[3]+'】';f.appendChild(b);f.appendChild(x);}
  else{var r=document.createElement('span');r.className='rb';r.textContent=m[1];r.setAttribute('data-r',m[2]);r.setAttribute('role','button');r.tabIndex=0;f.appendChild(r);}
  last=RE.lastIndex;}
 if(last<t.length)f.appendChild(document.createTextNode(t.slice(last)));return f;}
function say(t,kind){t=t.replace(/【[^】]*】/g,'').replace(/\{([^|}]*)\|([^}]*)\}/g,'$2');
 if(kind==='t')t=t.replace(/^[\d.\/]+\s*→\s*/,'');
 return t.replace(/→/g,'、').replace(/[＞＋～〜]/g,'、').replace(/[\/／]/g,'、').replace(/\s+/g,' ').trim();}
var sections=[],cur=null,exMode=false;
var TITLES={A:'Adverbs & Conjunctions',G:'Grammar'};
function btn(){var b=document.createElement('button');b.type='button';b.className='pb';b.textContent='▶';b.setAttribute('aria-label','Play');return b;}
var lines=$('d').textContent.split('\n');
lines.forEach(function(ln){
 if(!ln||ln.charAt(0)==='/')return;
 if(ln.charAt(0)==='#'){var id=ln.slice(1);var title=TITLES[id]||('Lesson '+id);
  var h=document.createElement('h2');h.id='s'+id;var pb=btn();pb.setAttribute('aria-label','Play '+title);var sp=document.createElement('span');sp.textContent=title;h.appendChild(pb);h.appendChild(sp);main.appendChild(h);
  cur={id:id,title:title,rows:[],el:h};sections.push(cur);pb.onclick=function(c){return function(){start(c.rows,0)}}(cur);
  var o=document.createElement('option');o.value='s'+id;o.textContent=title;jump.appendChild(o);exMode=(id==='G');return;}
 if(ln==='-'){var s=document.createElement('div');s.className='sp';main.appendChild(s);return;}
 var p=ln.split('\t'),k=p[0];
 if(k==='h'){var h3=document.createElement('h3');h3.textContent=p[1]==='副詞'?'Adverbs':p[1]==='接続詞'?'Conjunctions':p[1];main.appendChild(h3);return;}
 var row=document.createElement('div');row.className='row '+k+(exMode&&k==='s'?' ex':'');
 var pb2=btn();var c=document.createElement('div');c.className='c';
 var u=[];
 if(k==='w'){var a=document.createElement('span');a.className='main';a.appendChild(frag(p[1]));var b2=document.createElement('span');b2.className='sub';b2.appendChild(frag(p[2]));c.appendChild(a);c.appendChild(b2);u=[say(p[1]),say(p[2])];}
 else if(k==='n'){c.appendChild(frag('【'+p[1]+'】'));u=[];pb2=null;}
 else if(k==='g'){var a2=document.createElement('span');a2.className='main';a2.appendChild(frag(p[1]));c.appendChild(a2);u=[say(p[1])];}
 else{c.appendChild(frag(p[1]));u=[say(p[1],k)];}
 if(pb2)row.appendChild(pb2);else{var ph=document.createElement('span');ph.style.width='28px';ph.style.flex='none';row.appendChild(ph);}
 row.appendChild(c);main.appendChild(row);
 if(u.length){var r={el:row,u:u.filter(Boolean)};cur.rows.push(r);pb2.onclick=function(r){return function(){start([r],0)}}(r);}
});
var first=document.createElement('option');first.textContent='Go to…';first.value='';jump.insertBefore(first,jump.firstChild);jump.selectedIndex=0;
jump.onchange=function(){if(jump.value){var e=$(jump.value);if(e)e.scrollIntoView({behavior:'smooth',block:'start'});}jump.selectedIndex=0;};
// reveal
main.addEventListener('click',function(e){var t=e.target;
 if(t.classList.contains('rb'))t.classList.toggle('on');
 else if(t.classList.contains('nt')){var x=t.nextSibling;if(x)x.classList.toggle('on');}});
main.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&(e.target.classList.contains('rb')||e.target.classList.contains('nt'))){e.preventDefault();e.target.click();}});
$('show').onclick=function(){var on=document.body.classList.toggle('all');this.classList.toggle('on',on);this.textContent=on?'Hide':'Show';};
// speech
var ss=window.speechSynthesis,voices=[],voice=null,rate=0.6,token=0,queue=[],idx=0,state='idle';
var msg=$('msg'),playBtn=$('play'),vsel=$('voice'),spd=$('spd');
if(!ss||!window.SpeechSynthesisUtterance){msg.hidden=false;msg.textContent='Audio is not supported in this browser.';}
var sr=store.get('jp_rate');if(sr&&['0.6','0.9','1.2'].indexOf(sr)>=0)spd.value=sr;rate=parseFloat(spd.value);
spd.onchange=function(){rate=parseFloat(spd.value);store.set('jp_rate',spd.value);};
function loadVoices(){if(!ss)return;var all=ss.getVoices()||[];
 voices=all.filter(function(v){return /^ja([-_]|$)/i.test(v.lang);});
 vsel.innerHTML='';voices.forEach(function(v,i){var o=document.createElement('option');o.value=i;o.textContent=v.name.replace(/^(Microsoft|Google)\s+/,'');vsel.appendChild(o);});
 var saved=store.get('jp_voice'),pick=-1;
 voices.forEach(function(v,i){if(pick<0&&saved&&v.name===saved)pick=i;});
 if(pick<0)voices.forEach(function(v,i){if(pick<0&&/kyoko/i.test(v.name))pick=i;});
 if(pick<0&&voices.length)pick=0;
 if(pick>=0){vsel.value=pick;voice=voices[pick];}
 vsel.hidden=voices.length<2;}
vsel.onchange=function(){voice=voices[parseInt(vsel.value,10)]||null;if(voice)store.set('jp_voice',voice.name);};
if(ss){loadVoices();if('onvoiceschanged' in ss)ss.addEventListener('voiceschanged',loadVoices);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function speak(t,tk){return new Promise(function(res){if(!ss)return res();
 var u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';if(voice)u.voice=voice;u.rate=rate;
 var done=false;function fin(){if(!done){done=true;clearTimeout(to);res();}}
 var to=setTimeout(fin,Math.max(4000,t.length*900/rate+3000));
 u.onend=fin;u.onerror=fin;ss.speak(u);});}
function mark(r){var o=document.querySelector('.row.cur');if(o)o.classList.remove('cur');if(r){r.el.classList.add('cur');r.el.scrollIntoView({behavior:'smooth',block:'center'});}}
function setState(s){state=s;playBtn.textContent=s==='playing'?'❚❚ Pause':s==='paused'?'▶ Resume':'▶ All';}
function loop(){var tk=++token;setState('playing');
 (async function(){
  while(idx<queue.length){if(tk!==token)return;var r=queue[idx];mark(r);
   for(var i=0;i<r.u.length;i++){if(tk!==token)return;await speak(r.u[i],tk);if(tk!==token)return;await sleep(i===0&&r.u.length>1?500:150);}
   if(tk!==token)return;idx++;await sleep(450);}
  if(tk===token){mark(null);setState('idle');queue=[];idx=0;}
 })();}
function halt(){token++;if(ss)ss.cancel();}
function start(rows,i){if(!ss||!rows.length)return;halt();queue=rows;idx=i;setTimeout(loop,60);}
function allRows(){var a=[];sections.forEach(function(s){a=a.concat(s.rows);});return a;}
playBtn.onclick=function(){if(!ss)return;
 if(state==='playing'){halt();setState('paused');}
 else if(state==='paused'){loop();}
 else start(allRows(),0);};
$('stop').onclick=function(){halt();mark(null);queue=[];idx=0;setState('idle');};
window.addEventListener('pagehide',function(){if(ss)ss.cancel();});
})();
</script>
</body>
</html>
