<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本語拡大とオーディオ</title>
<style>
:root{--paper:#f3f5f8;--sheet:#fff;--ink:#1d2433;--muted:#667089;--rule:#dfe3ec;--ai:#2c4a8a;--ai-soft:#e3e9f6;--now:#fff4d6;--now-edge:#e2b53e;--pr:#2f6b4f;--pr-soft:#e4f1ea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#11151d;--sheet:#181d28;--ink:#e6e9f1;--muted:#949db3;--rule:#2a3141;--ai:#9db5ec;--ai-soft:#233154;--now:#3a3220;--now-edge:#d8ab3c;--pr:#8fd0ae;--pr-soft:#1f3a2e;color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;font-size:15px}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 80px}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:1.7rem;margin:0}
header p{color:var(--muted);margin:4px 0 0;font-size:.9rem;line-height:1.5}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;display:grid;gap:8px;border-bottom:1px solid var(--rule);margin-top:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;min-width:2.4rem;height:2.1rem;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:500 .9rem system-ui;cursor:pointer}
.tab.on{background:var(--ai);color:var(--sheet);border-color:var(--ai)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{height:2.3rem;padding:0 14px;border-radius:6px;border:1px solid var(--ai);background:var(--ai);color:var(--sheet);font:700 .88rem system-ui;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ai)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;color:var(--muted);font:500 .82rem system-ui;padding:0 10px;height:2.1rem;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ai-soft);color:var(--ai);font-weight:700}
.lbl{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grp{display:inline-flex;align-items:center;gap:6px;min-width:0}
select{height:2.1rem;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-size:.82rem;max-width:100%;min-width:0}
button:focus-visible,select:focus-visible{outline:2px solid var(--now-edge);outline-offset:2px}
#status{font-size:.82rem;color:var(--muted);min-height:1.2em}
.notice{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--now);border:1px solid var(--now-edge);font-size:.88rem}
section{scroll-margin-top:150px}
h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:1.25rem;margin:24px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 small{font:400 .78rem system-ui;color:var(--muted)}
h2 .btn{height:1.9rem;font-size:.78rem;padding:0 10px;margin-left:auto}
ol{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
ol>li+li{border-top:1px solid var(--rule)}
.line{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;color:inherit;font:inherit;padding:11px 14px;cursor:pointer;line-height:1.55}
.line:hover{background:var(--ai-soft)}
.line.now{background:var(--now);box-shadow:inset 3px 0 0 var(--now-edge)}
.ic{flex:0 0 auto;margin-top:.45em;color:var(--ai)}
.tx{font-size:1.05rem}
.p{display:flex;gap:10px;width:100%;text-align:left;background:var(--pr-soft);border:0;border-top:1px dashed var(--rule);color:inherit;font:inherit;padding:8px 14px 8px 34px;cursor:pointer;line-height:1.5}
.p:hover{filter:brightness(.97)}
.p.now{background:var(--now);box-shadow:inset 3px 0 0 var(--now-edge)}
.p .ic{color:var(--pr)}
.p b{font-weight:700;color:var(--pr);margin-right:6px}
.p .rd{display:block;color:var(--muted);font-size:.8rem}
body.orig .p,body.orig .ptag{display:none}
body.prac .line{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
<header><h1>日本語拡大とオーディオ</h1><p>Original lines plus a practice sentence for every word · tap any row to hear it · default speed: Slow</p></header>
<div class="bar">
 <div class="tabs" id="tabs"></div>
 <div class="controls">
  <button class="btn" id="playAll">▶ Play all lessons</button>
  <button class="btn ghost" id="prev" aria-label="Previous line">⏮</button>
  <button class="btn ghost" id="next" aria-label="Next line">⏭</button>
  <button class="btn ghost" id="stop" hidden>■ Stop</button>
  <span class="grp"><span class="lbl">Speed</span><span class="seg" id="speed"><button data-v="0.7">Slow</button><button data-v="0.9">Normal</button><button data-v="1.1">Fast</button></span></span>
  <span class="grp"><span class="lbl">Repeat</span><span class="seg" id="rep"><button data-v="1">×1</button><button data-v="2">×2</button><button data-v="3">×3</button></span></span>
  <span class="grp" id="modeG" hidden><span class="lbl">Play</span><span class="seg" id="mode"><button data-v="all">All</button><button data-v="orig">Original</button><button data-v="prac">Practice</button></span></span>
  <span class="grp"><span class="lbl">Voice</span><select id="voice"></select></span>
 </div>
 <div id="status" aria-live="polite"></div>
</div>
<div class="notice" id="novoice" hidden>No Japanese voice found on this device. Install a Japanese text-to-speech voice in your system settings, or try Chrome, Safari or Edge.</div>
<main id="main"></main>
</div>
