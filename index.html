function mark(){all.forEach(x=>x.classList.remove('cur'));if(cur_){cur_.classList.add('cur');const sc=cur_.closest('section');sc.classList.add('open');cur_.scrollIntoView({block:'center',behavior:'smooth'})}
 document.querySelectorAll('.pb').forEach(b=>b.textContent='▶');if(cur_&&playing)cur_.querySelector('.pb').textContent='■';PL.textContent=playing?'⏸':'▶'}
function stop(){tok++;playing=false;if(ss)ss.cancel();mark()}
function say(){if(!ss)return;if(idx>=list.length){stop();cur_=null;mark();return}
 cur_=list[idx];playing=true;mark();const my=++tok;ss.cancel();
 const u=new SpeechSynthesisUtterance(cur_.dataset.s);u.lang='ja-JP';u.rate=parseFloat(SP.value);
 const v=voices.find(v=>v.name===VO.value);if(v)u.voice=v;
 u.onend=()=>{if(my===tok){idx++;say()}};u.onerror=()=>{if(my===tok&&playing){idx++;say()}};
 setTimeout(()=>{if(my===tok)ss.speak(u)},60)}
function play(l,i){list=l;idx=i;say()}
function step(d){if(!list.length||list.length===1){list=all;idx=Math.max(0,all.indexOf(cur_))}
 idx=Math.min(Math.max(idx+d,0),list.length-1);say()}
PL.onclick=()=>{if(playing){stop();return}if(!list.length||idx>=list.length){play(all,0)}else say()};
document.getElementById('pv').onclick=()=>step(-1);document.getElementById('nx').onclick=()=>step(1);
if(!ss)PL.disabled=true;
