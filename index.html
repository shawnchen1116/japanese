<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#7a7a72;--ac:#b3261e;--bar:#fff;--bd:#e2e0d8;--hl:#fff1c2;--rd:#0a6c4a;--nt:#5b4bb5;--pr:#f1efe8}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a90;--ac:#ff8a80;--bar:#222220;--bd:#34332f;--hl:#4a4020;--rd:#6fd6a8;--nt:#b3a6ff;--pr:#1f1f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.8 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#bar{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--bd);display:flex;gap:4px;align-items:center;padding:6px 6px;overflow-x:auto;white-space:nowrap}
#bar button,#bar select{font:inherit;font-size:15px;height:36px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 6px;flex:none}
#bar button{min-width:36px}
#bar button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#bar #play{min-width:44px;font-weight:700}
#bar select{max-width:84px;padding:0 2px}#bar #lsel{width:58px}
main{max-width:760px;margin:0 auto;padding:4px 14px 80px}
section{margin-top:18px}
h2{font-size:18px;margin:0;padding:6px 0;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ac);scroll-margin-top:56px}
h2 button{font-size:13px}
.ln{display:flex;gap:8px;align-items:flex-start;padding:2px 4px;border-radius:8px;scroll-margin-top:60px}
.ln.cur{background:var(--hl)}
.pl{flex:none;width:30px;height:30px;margin-top:3px;border:1px solid var(--bd);border-radius:50%;background:transparent;color:var(--ac);font-size:12px;padding:0}
.tx{flex:1;word-break:break-word}
.pr{margin:0 0 0 22px;background:var(--pr);border-left:3px solid var(--bd)}
.pr .tx{font-size:16px}
.pr .lb{color:var(--mut);font-size:13px;margin-right:6px}
body.nopr .pr{display:none}
.w{border-bottom:1.5px dotted var(--rd);cursor:pointer}
.r{color:var(--rd);font-size:.85em}
.n{color:var(--nt);font-size:.78em;cursor:pointer;text-decoration:underline;margin:0 2px;white-space:nowrap}
.nt{color:var(--nt);font-size:.85em}
.alt{color:var(--mut)}
body.all .w{border-bottom-style:solid}
.btn{font:inherit;font-size:13px;height:28px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 8px}
</style>
</head>

var isK=function(c){return /[一-鿿々]/.test(c)};
var KEYS=Object.keys(DICT).sort(function(a,b){return b.length-a.length});
function dictRead(s){
  s=s.replace(/何(?=です|だ|の)/g,'なん').replace(/何(?=[歳時分度枚杯本個冊台匹人回])/g,'なん')
     .replace(/何(?=[がをもかで])/g,'なに').replace(/何/g,'なに');

  s=s.replace(/方/g,'ほう');
  var out='',i=0;
  while(i<s.length){
    var hit=null;
    if(isK(s[i])){
      for(var k=0;k<KEYS.length;k++){ if(s.startsWith(KEYS[k],i)){hit=KEYS[k];break;} }

function parse(line){

function align(P,r){

function arrowSpeech(line){
