<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese Grammars</title>
<style>
:root{--bg:#fbfaf7;--card:#fff;--fg:#1f1f1f;--mute:#6b6b6b;--line:#e6e2da;--acc:#b3412e;--acc2:#2f6f8f;--hl:#fff3cf;--r:#2f6f8f}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--fg:#ececec;--mute:#a0a0a0;--line:#333;--acc:#e07a63;--acc2:#7fb6d3;--hl:#3a3320;--r:#8cc3df}}
*{box-sizing:border-box}
html{scroll-padding-top:56px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang SC","Noto Sans JP","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 12px;display:flex;gap:6px;align-items:center}
header select{flex:1;min-width:0;font-size:15px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.ib{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;height:34px;min-width:38px;font-size:15px;padding:0 9px;cursor:pointer}
.ib.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
#stop{display:none;background:var(--acc);color:#fff;border-color:var(--acc)}
body.playing #stop{display:inline-block}
#panel{display:none;position:sticky;top:47px;z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px;font-size:14px}
#panel.open{display:block}
#panel .row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
#panel label{color:var(--mute);min-width:52px}
#panel select{flex:1;min-width:0;font-size:14px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:4px 10px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
main{max-width:760px;margin:0 auto;padding:8px 16px 80px}
h1{font-size:20px;margin:12px 0 4px}
h2{font-size:18px;margin:28px 0 6px;padding-top:8px;border-top:2px solid var(--acc);color:var(--acc)}
h2 .st,h3 .st{font-size:12px;color:#c99a00;font-weight:normal;white-space:nowrap}
.pt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0}
h3{font-size:16px;margin:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
h3 .tt{flex:1}
.acts{display:flex;gap:6px;flex-shrink:0}
a.nl{color:var(--acc2);font-weight:bold;text-decoration:none;border:1px solid var(--acc2);border-radius:6px;padding:0 6px;font-size:13px;line-height:22px;display:inline-block;cursor:pointer}
a.nl.on{background:var(--acc2);color:#fff}
.pa{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;font-size:13px;padding:0 7px;line-height:22px;cursor:pointer}
.note{display:none;font-size:14px;color:var(--mute);background:var(--bg);border-left:3px solid var(--acc2);padding:6px 10px;margin:8px 0;border-radius:0 6px 6px 0}
.note.open{display:block}
.note p{margin:4px 0}
ul.ex{list-style:none;padding:0;margin:8px 0 0}
ul.ex li{display:flex;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
ul.ex li.cur{background:var(--hl);border-radius:6px}
.pb{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--acc);font-size:13px;cursor:pointer}
.tx{flex:1;min-width:0}
.ja{font-size:17px;line-height:1.75}
.zh{font-size:13.5px;color:var(--mute)}
.tag{font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:0 3px;margin-left:4px;vertical-align:1px}
.k{cursor:pointer;border-bottom:1px dotted var(--r)}
.k .r{display:none;color:var(--r);font-size:.82em}
.k.on .r,body.allr .k .r{display:inline}
body.notr .zh{display:none}
body.prac .ja{filter:blur(6px);cursor:pointer;user-select:none}
body.prac .ja.shown{filter:none;user-select:auto}
#ov a{color:var(--fg);text-decoration:none}
#ov li{padding:3px 0;border-bottom:1px solid var(--line);display:flex;gap:6px;font-size:14.5px}
#ov ol{list-style:none;padding:0;margin:6px 0}
#ov .n{color:var(--mute);width:22px;flex-shrink:0}
#ov .l{color:var(--mute);font-size:12px;margin-left:auto;text-align:right}
.tips li{margin:4px 0;font-size:15px}
#warn{display:none;font-size:13px;color:var(--acc);margin:6px 0}
</style>
</head>
<body>
<header>
 <select id="nav" aria-label="Jump to group"></select>
 <button class="ib" id="stop" title="Stop">■</button>
 <button class="ib" id="cfg" title="Settings" aria-label="Settings">⚙</button>
</header>
<div id="panel">
 <div class="row"><label>Voice</label><select id="voice"></select></div>
 <div class="row"><label>Speed</label><div class="seg" id="speed"><button data-v="0.6">Slow</button><button data-v="0.85">Normal</button><button data-v="1.1">Fast</button></div></div>
 <div class="row"><label>Show</label><div class="seg" id="tog"><button data-c="notr" data-inv="1">Translation</button><button data-c="allr">All readings</button><button data-c="prac">Practice</button></div></div>
 <div id="warn">No speech voice found in this browser.</div>
</div>
<main id="main"></main>
<script>
const D={"groups": [{"no": 1, "title": "基础助词", "intro": "助词决定句中每个词的作用，几乎每个句子都会用到两三个，所以这一组最值得花时间。重点对比两对最容易混淆的助词：“は”和“が”，“に”和“で”。", "points": [{"title": "は（提示主题）（第1课）", "usage": "提示句子的话题，相当于“关于……来说”。“は”作助词时读“wa”。第5课又学了表示对比的用法。", "stars": "★★★★★", "rnote": "几乎每句话都有。对比用法也很常见：肉（にく）は食（た）べますが、魚（さかな）は食（た）べません。", "ex": [["李（り）さんは中国人（ちゅうごくじん）です。", "李先生是中国人。", 1], ["今日（きょう）は暑（あつ）いですね。", "今天真热啊。", 0], ["お酒（さけ）は飲（の）みませんが、ビールは少（すこ）し飲（の）みます。", "烈酒不喝，啤酒喝一点。", 0], ["わたしは会社員（かいしゃいん）です。", "我是公司职员。", 0], ["この本（ほん）は面白（おもしろ）いです。", "这本书很有意思。", 0], ["東京（とうきょう）は大（おお）きい町（まち）です。", "东京是个大城市。", 0], ["肉（にく）は食（た）べますが、魚（さかな）は食（た）べません。", "肉吃，但是鱼不吃。", 0], ["兄（あに）は医者（いしゃ）です。", "哥哥是医生。", 0], ["日曜日（にちようび）は休（やす）みです。", "星期天休息。", 0], ["英語（えいご）は分（わ）かりますが、フランス語（ご）は分（わ）かりません。", "英语懂，但法语不懂。", 0], ["駅（えき）はあそこです。", "车站在那边。", 0]]}, {"title": "が（主语、对象）（第4、11课）", "usage": "表示主语，特别是新信息、疑问词的主语及其回答；也表示“好（す）き・上手（じょうず）・分（わ）かる・できる・欲（ほ）しい・ある”等的对象。", "stars": "★★★★★", "rnote": "记住一条规律：疑问词作主语时用“が”（誰（だれ）が、何（なに）が），回答时也用“が”。", "ex": [["小野（おの）さんは歌（うた）が好（す）きです。", "小野女士喜欢唱歌。", 1], ["誰（だれ）が来（き）ましたか。田中（たなか）さんが来（き）ました。", "谁来了？田中先生来了。", 0], ["雨（あめ）が降（ふ）っています。", "正在下雨。", 0], ["わたしは猫（ねこ）が好（す）きです。", "我喜欢猫。", 0], ["森（もり）さんはテニスが上手（じょうず）です。", "森先生网球打得很好。", 0], ["新（あたら）しいパソコンが欲（ほ）しいです。", "我想要一台新电脑。", 0], ["果物（くだもの）は何（なに）がいちばん好（す）きですか。", "水果里你最喜欢什么？", 0], ["今日（きょう）は風（かぜ）が強（つよ）いです。", "今天风很大。", 0], ["わたしは中国語（ちゅうごくご）が少（すこ）し分（わ）かります。", "我懂一点中文。", 0], ["どこが痛（いた）いですか。", "哪里疼？", 0], ["明日（あした）は時間（じかん）があります。", "明天有时间。", 0]]}, {"title": "を（宾语、经过与离开的场所）（第7、14课）", "usage": "表示动作的对象；第14课学习了表示移动经过的场所和离开的起点。", "stars": "★★★★★", "rnote": "", "ex": [["李（り）さんは毎日（まいにち）コーヒーを飲（の）みます。", "李先生每天喝咖啡。", 1], ["公園（こうえん）を散歩（さんぽ）しました。", "在公园里散步了。", 0], ["8時（じ）に家（いえ）を出（で）ます。", "8点出家门。", 0], ["毎晩（まいばん）テレビを見（み）ます。", "每天晚上看电视。", 0], ["図書館（としょかん）で本（ほん）を借（か）りました。", "在图书馆借了书。", 0], ["次（つぎ）の角（かど）を右（みぎ）に曲（ま）がってください。", "请在下一个路口向右拐。", 0], ["この橋（はし）を渡（わた）ります。", "过这座桥。", 0], ["3時（じ）に会社（かいしゃ）を出（で）ました。", "3点离开了公司。", 0], ["駅（えき）の前（まえ）でバスを降（お）りました。", "在车站前下了公共汽车。", 0], ["朝（あさ）、窓（まど）を開（あ）けます。", "早上打开窗户。", 0], ["毎日（まいにち）、日本語（にほんご）を勉強（べんきょう）しています。", "每天都在学日语。", 0]]}, {"title": "に（时间、存在场所、对象、目的地）（第4、5、8、15课）", "usage": "表示一个“点”：时间点、存在的场所、动作的接受者、移动的目的地。", "stars": "★★★★★", "rnote": "具体时间（7時（じ）、5月（がつ）3日（みっか））要加“に”；“今日（きょう）、明日（あした）、毎日（まいにち）”等相对时间不加。", "ex": [["森（もり）さんは7時（じ）に起（お）きます。", "森先生7点起床。", 1], ["部屋（へや）に机（つくえ）といすがあります。", "房间里有桌子和椅子。", 1], ["友達（ともだち）に手紙（てがみ）を書（か）きました。", "给朋友写了信。", 0], ["5月（がつ）3日（みっか）に日本（にほん）へ行（い）きます。", "5月3日去日本。", 0], ["毎朝（まいあさ）6時半（じはん）に起（お）きます。", "每天早上六点半起床。", 0], ["李（り）さんは今（いま）、会議室（かいぎしつ）にいます。", "李先生现在在会议室。", 0], ["母（はは）に電話（でんわ）をかけました。", "给妈妈打了电话。", 0], ["先生（せんせい）に質問（しつもん）しました。", "向老师提了问题。", 0], ["来年（らいねん）、大阪（おおさか）に引（ひ）っ越（こ）します。", "明年搬到大阪去。", 0], ["駅（えき）の前（まえ）に銀行（ぎんこう）があります。", "车站前面有一家银行。", 0], ["土曜日（どようび）の夜（よる）に友達（ともだち）と会（あ）います。", "星期六晚上和朋友见面。", 0]]}, {"title": "で（动作场所、工具手段、原因）（第7、8、27课）", "usage": "表示动作进行的场所、使用的工具或手段（第8课）、交通工具（第6课），以及原因（第27课）。", "stars": "★★★★★", "rnote": "和“に”对比：図書館（としょかん）にいます（在图书馆），図書館（としょかん）で勉強（べんきょう）します（在图书馆学习）。", "ex": [["李（り）さんは日本語（にほんご）で手紙（てがみ）を書（か）きます。", "李先生用日语写信。", 1], ["電車（でんしゃ）で会社（かいしゃ）へ行（い）きます。", "坐电车去公司。", 0], ["風邪（かぜ）で学校（がっこう）を休（やす）みました。", "因为感冒没去上学。", 0], ["図書館（としょかん）で勉強（べんきょう）します。", "在图书馆学习。", 0], ["箸（はし）でご飯（はん）を食（た）べます。", "用筷子吃饭。", 0], ["デパートでかばんを買（か）いました。", "在百货商店买了包。", 0], ["毎日（まいにち）、自転車（じてんしゃ）で学校（がっこう）へ行（い）きます。", "每天骑自行车上学。", 0], ["メールで連絡（れんらく）します。", "用邮件联系。", 0], ["台風（たいふう）で電車（でんしゃ）が止（と）まりました。", "因为台风，电车停了。", 0], ["駅（えき）の前（まえ）で友達（ともだち）を待（ま）ちます。", "在车站前面等朋友。", 0], ["ボールペンで名前（なまえ）を書（か）いてください。", "请用圆珠笔写名字。", 0]]}, {"title": "へ（方向）（第6课）", "usage": "表示移动的方向，读作“e”。", "stars": "★★★★", "rnote": "和“行（い）く・来（く）る・帰（かえ）る”连用时可以换成“に”，口语中“に”更常用。", "ex": [["吉田（よしだ）さんは来月（らいげつ）中国（ちゅうごく）へ行（い）きます。", "吉田先生下个月去中国。", 1], ["どこへ行（い）きますか。", "你去哪儿？", 0], ["明日（あした）、京都（きょうと）へ行（い）きます。", "明天去京都。", 0], ["何時（なんじ）にうちへ帰（かえ）りますか。", "几点回家？", 0], ["去年（きょねん）、日本（にほん）へ来（き）ました。", "去年来到了日本。", 0], ["週末（しゅうまつ）はどこへも行（い）きませんでした。", "周末哪儿也没去。", 0], ["父（ちち）は今朝（けさ）、アメリカへ出発（しゅっぱつ）しました。", "父亲今天早上动身去美国了。", 0], ["夏休（なつやす）みに海（うみ）へ行（い）きたいです。", "暑假 // playback
let queue=[],tok=0;
function mark(i){document.querySelectorAll('li.cur').forEach(x=>x.classList.remove('cur'));if(i!=null){const li=document.getElementById('s'+i);li&&li.classList.add('cur');}}
function stop(){tok++;queue=[];if(syn)syn.cancel();mark(null);document.body.classList.remove('playing');}
function playList(list){
 if(!syn)return;stop();const my=++tok;queue=list.slice();document.body.classList.add('playing');
 const next=()=>{if(my!==tok)return;if(!queue.length){mark(null);document.body.classList.remove('playing');return;}
  const i=queue.shift();mark(i);const li=document.getElementById('s'+i);
  if(list.length>1&&li){const r=li.getBoundingClientRect();if(r.top<60||r.bottom>innerHeight)li.scrollIntoView({block:'center',behavior:'smooth'});}
  const u=new SpeechSynthesisUtterance(S[i]);u.lang='ja-JP';u.rate=st.rate;
  const v=voices.find(x=>x.name===$('#voice').value);if(v)u.voice=v;
  u.onend=()=>{if(my===tok)setTimeout(next,700);};u.onerror=u.onend;syn.speak(u);};
 next();
}
$('#stop').onclick=stop;
document.addEventListener('click',e=>{
 const t=e.target;
 const ja=t.closest('.ja');
 if(ja&&st.prac&&!ja.classList.contains('shown')){ja.classList.add('shown');return;}
 const k=t.closest('.k');if(k){k.classList.toggle('on');return;}
 const nl=t.closest('a.nl');if(nl){e.preventDefault();nl.classList.toggle('on');document.getElementById('n-'+nl.dataset.n).classList.toggle('open');return;}
 const pb=t.closest('.pb');if(pb){playList([+pb.dataset.i]);return;}
 const pa=t.closest('.pa');if(pa){playList([...document.querySelectorAll(`li[data-p="${pa.dataset.p}"]`)].map(li=>+li.id.slice(1)));return;}
});
</script>
</body>
</html>
