<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japanese Vocabulary</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e4e2dc;--acc:#c2410c;--acc2:#fff3ea;--rd:#0f6e8c;--hi:#fde68a;--btn:#efede7}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#ececef;--mute:#9a9aa2;--line:#2e2e33;--acc:#fb923c;--acc2:#2a1e15;--rd:#5ec8e5;--hi:#5b4a12;--btn:#2a2a2e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","PingFang SC",sans-serif;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 10px calc(6px) 10px;padding-top:max(6px,env(safe-area-inset-top))}
.bar{display:flex;gap:6px;align-items:center}
.tabs{display:flex;flex:1;background:var(--btn);border-radius:10px;padding:2px}
.tabs button{flex:1;border:0;background:none;padding:6px 2px;border-radius:8px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.ib{border:0;background:var(--btn);border-radius:9px;min-width:36px;height:34px;padding:0 9px;cursor:pointer;font-size:15px;white-space:nowrap}
.ib.pri{background:var(--acc);color:#fff}
.tools{display:flex;gap:6px;margin-top:6px;align-items:center}
.tools select{flex:1;min-width:0;height:34px;border:0;border-radius:9px;background:var(--btn);padding:0 6px;font-size:14px}
.tools input{flex:1;min-width:0;height:34px;border:0;border-radius:9px;background:var(--btn);padding:0 10px;font-size:14px}
.hide{display:none!important}
main{max-width:760px;margin:0 auto;padding:8px 10px 90px}
.cnt{color:var(--mute);font-size:12px;margin:2px 4px 6px}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.row.cur,.sen.cur,.fm.cur{outline:2px solid var(--acc);background:var(--acc2)}
.pb{flex:none;border:0;width:32px;height:32px;border-radius:50%;background:var(--btn);cursor:pointer;font-size:12px;color:var(--acc)}
.body{flex:1;min-width:0}
.wd{font-size:20px;cursor:pointer;word-break:break-word}
.k{cursor:pointer}
.k .rd{display:none;color:var(--rd);font-size:.72em}
.k.on .rd,body.showr .k .rd{display:inline}
.k.on{color:var(--rd)}
.tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.nt{color:var(--acc);font-size:13px;text-decoration:none;border:1px solid var(--acc);border-radius:6px;padding:0 5px;margin-left:6px;cursor:pointer;white-space:nowrap;vertical-align:middle}
.nb{display:none;color:var(--mute);font-size:14px;margin-top:2px}
.nb.on,body.shown .nb{display:block}
.ms{font-size:14px;color:var(--mute)}
.fx{border:0;background:none;color:var(--acc);font-size:13px;cursor:pointer;padding:2px 0;display:block}
.forms{display:none;grid-template-columns:1fr;gap:4px;margin-top:6px}
.forms.on{display:grid}
.fm{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:4px}
.fm .fl{width:84px;flex:none;font-size:12px;color:var(--mute)}
.fm .fv{flex:1;font-size:17px}
.fm .pb{width:28px;height:28px}
.pt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
.pt h2{font-size:17px;margin:0;display:flex;align-items:center;gap:6px}
.pt h2 span{flex:1}
.sen{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-top:1px solid var(--line);border-radius:8px}
.sen .tx{flex:1;font-size:18px;line-height:1.7}
.t{background:linear-gradient(transparent 60%,var(--hi) 60%);font-weight:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;margin-top:8px}
.card .q{font-size:36px;line-height:1.4;word-break:break-word}
.card .q.cn{font-size:24px}
.card .sub{color:var(--mute);font-size:14px;margin-top:6px}
.card .a{margin-top:16px;font-size:20px;min-height:60px}
.card .a .r2{color:var(--rd);font-size:22px}
.cbar{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.cbar .ib{height:42px;min-width:56px;font-size:16px}
#set{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#set .pn{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:14px 16px max(16px,env(safe-area-inset-bottom))}
.pn label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.pn select{max-width:62%;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.pn input[type=checkbox]{width:22px;height:22px}
.pn .hd{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:4px}
.foot{color:var(--mute);font-size:12px;margin:24px 4px;line-height:1.6}
#now{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:20px;padding:6px 8px 6px 14px;font-size:14px;display:flex;gap:8px;align-items:center;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#now button{border:0;border-radius:14px;background:var(--acc);color:#fff;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="tabs" id="tabs">
      <button data-t="w" class="on">Words</button><button data-t="v">Verbs</button><button data-t="p">Practice</button><button data-t="c">Cards</button>
    </div>
    <button class="ib" id="gear" aria-label="Settings">⚙</button>
  </div>
  <div class="tools" id="tw">
    <select id="cat"></select>
    <select id="les"></select>
    <button class="ib" id="sbtn" aria-label="Search">⌕</button>
    <button class="ib pri" id="pall" aria-label="Play all">▶</button>
  </div>
  <div class="tools hide" id="tv">
    <select id="vg"><option value="a">All groups</option><option value="1">Group 1</option><option value="2">Group 2</option><option value="3">Group 3</option></select>
    <select id="vs"><option value="a">A–Z</option><option value="e">By ending</option></select>
    <select id="vles"></select>
    <button class="ib" id="vsbtn" aria-label="Search">⌕</button>
  </div>
  <div class="tools hide" id="tp">
    <select id="pj"></select>
    <button class="ib pri" id="ppall" aria-label="Play point">▶</button>
  </div>
  <div class="tools hide" id="tc">
    <select id="cm"><option value="jc">JP → 中文</option><option value="cj">中文 → JP</option><option value="vf">Verb forms</option></select>
    <select id="cf" class="hide"></select>
    <button class="ib" id="cshuf" aria-label="Shuffle">⇄</button>
  </div>
  <div class="tools hide" id="srow"><input id="q" type="search" placeholder="Search kana, kanji or 中文" autocomplete="off"></div>
</header>
<main>
  <section id="pw"><div class="cnt" id="wc"></div><div id="wl"></div></section>
  <section id="pv" class="hide"><div class="cnt" id="vc"></div><div id="vl"></div></section>
  <section id="pp" class="hide"><div id="pl"></div></section>
  <section id="pc" class="hide">
    <div class="cnt" id="cc"></div>
    <div class="card" id="card"><div class="q" id="cq"></div><div class="sub" id="cs"></div><div class="a" id="ca"></div></div>
    <div class="cbar">
      <button class="ib" id="cprev">◀</button>
      <button class="ib" id="cplay">🔊</button>
      <button class="ib pri" id="cshow">Show</button>
      <button class="ib" id="cnext">▶</button>
    </div>
  </section>
  <div class="foot" id="foot"></div>
</main>
<div id="now" class="hide"><span id="nowt">Playing…</span><button id="stop">■ Stop</button></div>
<div id="set" class="hide"><div class="pn">
  <div class="hd"><span>Settings</span><button class="ib" id="sclose">✕</button></div>
  <label>Voice <select id="voice"></select></label>
  <label>Speed <select id="rate"><option value="0.5">Very slow</option><option value="0.7">Slow</option><option value="1">Normal</option><option value="1.2">Fast</option></select></label>
  <label>Repeat <select id="rep"><option>1</option><option>2</option><option>3</option></select></label>
  <label>Pause <select id="gap"><option value="500">0.5 s</option><option value="1000">1 s</option><option value="2000">2 s</option><option value="3000">3 s</option></select></label>
  <label>Read aloud <select id="spk"><option value="k">Kana (exact readings)</option><option value="t">Original text</option></select></label>
  <label>Show all readings <input type="checkbox" id="showr"></label>
  <label>Show all 注 <input type="checkbox" id="shown"></label>
</div></div>

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RX=/([㐀-鿿A-Za-z0-9々.]+)（([ぁ-んァ-ヶー～]+)）/g;
function html(mu){return esc(mu).replace(RX,(m,k,r)=>`<span class="k">${k}<span class="rd">（${r}）</span></span>`).replace(/\{/g,'<b class="t">').replace(/\}/g,'</b>')}
function kana(mu){return mu.replace(/[{}]/g,'').replace(RX,'$2').replace(/～/g,'')}
function plain(mu){return mu.replace(/[{}]/g,'').replace(RX,'$1')}
// ---------- settings ----------
const S={voice:'',rate:'0.7',rep:'1',gap:'1000',spk:'k',showr:false,shown:false,tab:'w'};
try{Object.assign(S,JSON.parse(localStorage.getItem('jv-set')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('jv-set',JSON.stringify(S))}catch(e){}}
['rate','rep','gap','spk'].forEach(k=>{const el=$('#'+k);el.value=S[k];el.onchange=()=>{S[k]=el.value;save()}});
['showr','shown'].forEach(k=>{const el=$('#'+k);el.checked=S[k];document.body.classList.toggle(k,S[k]);el.onchange=()=>{S[k]=el.checked;document.body.classList.toggle(k,S[k]);save()}});
$('#gear').onclick=()=>$('#set').classList.remove('hide');
$('#sclose').onclick=()=>$('#set').classList.add('hide');
$('#set').onclick=e=>{if(e.target.id==='set')$('#set').classList.add('hide')};
// ---------- voices ----------
let voices=[];
function loadVoices(){
  if(!('speechSynthesis' in window))return;
  voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  const sel=$('#voice');sel.innerHTML='';
  if(!voices.length){sel.innerHTML='<option value="">Default (ja-JP)</option>';return}
  voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name.replace(/\s*\(.*\)/,'')+(v.localService?'':' ☁');sel.appendChild(o)});
  let pick=voices.find(v=>v.name===S.voice)||voices.find(v=>/kyoko/i.test(v.name))||voices[0];
  sel.value=pick.name;S.voice=pick.name;
  sel.onchange=()=>{S.voice=sel.value;save();say1('こんにちは')};
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
// ---------- speech ----------
let queue=[],qi=0,playing=false,timer=null,curEl=null;
function utter(text){
  const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=parseFloat(S.rate);
  const v=voices.find(v=>v.name===S.voice);if(v)u.voice=v;return u}
function stop(){playing=false;clearTimeout(timer);queue=[];if('speechSynthesis' in window)speechSynthesis.cancel();mark(null);$('#now').classList.add('hide')}
function mark(el){if(curEl)curEl.classList.remove('cur');curEl=el;if(el){el.classList.add('cur');const r=el.getBoundingClientRect();if(r.top<110||r.bottom>innerHeight-60)el.scrollIntoView({block:'center',behavior:'smooth'})}}
function textOf(item){return S.spk==='t'?plain(item.mu):kana(item.mu)}
function say1(t){if(!('speechSynthesis' in window))return alert('Speech is not supported in this browser.');stop();speechSynthesis.speak(utter(t))}
function play(items,label){
  if(!('speechSynthesis' in window))return alert('Speech is not supported in this browser.');
  stop();queue=items;qi=0;playing=true;let rep=0;
  if(items.length>1){$('#now').classList.remove('hide');}
  const step=()=>{
    if(!playing)return;
    if(qi>=queue.length){stop();return}
    const it=queue[qi];mark(it.el);
    if(items.length>1)$('#nowt').textContent=`${label||'Playing'} ${qi+1}/${queue.length}`;
    const u=utter(textOf(it));
    u.onend=()=>{if(!playing)return;rep++;if(rep>=+S.rep){rep=0;qi++}timer=setTimeout(step,+S.gap)};
    u.onerror=u.onend;
    speechSynthesis.speak(u);
  };
  step();
}
$('#stop').onclick=stop;
// ---------- delegated taps ----------
document.addEventListener('click',e=>{
  const k=e.target.closest('.k');
  if(k&&!e.target.closest('.card')){k.classList.toggle('on');return}
  const wd=e.target.closest('.wd');
  if(wd){const ks=wd.querySelectorAll('.k');const on=![...ks].every(x=>x.classList.contains('on'));ks.forEach(x=>x.classList.toggle('on',on));return}
  const nt=e.target.closest('.nt');
  if(nt){e.preventDefault();const nb=nt.parentElement.parentElement.querySelector(':scope > .nb')||nt.closest('.body,.pt,.tx').querySelector('.nb');if(nb)nb.classList.toggle('on');return}
});
// ---------- lessons ----------
function lessonOpts(sel){sel.innerHTML='<option value="0">All lessons</option>'+Array.from({length:48},(_,i)=>`<option value="${i+1}">Lesson ${i+1}</option>`).join('')}
lessonOpts($('#les'));lessonOpts($('#vles'));
const W=D.words;W.forEach((w,i)=>{w.i=i;w.pl=plain(w.w);w.kn=kana(w.w)});
$('#cat').innerHTML='<option value="-1">All words</option>'+D.cats.map((c,i)=>`<option value="${i}">${c} (${W.filter(w=>w.c===i).length})</option>`).join('');
let query='';
function matchQ(w){if(!query)return true;const q=query.toLowerCase();return w.r.includes(q)||w.pl.includes(q)||w.m.includes(q)||(w.ms&&plain(w.ms).includes(q))}
function lesTxt(l){return l.map(n=>'第'+n+'课').join('、')}
// ---------- Words ----------
let wItems=[];
function renderWords(){
  const c=+$('#cat').value,l=+$('#les').value;
  const list=W.filter(w=>(c<0||w.c===c)&&(!l||w.l.includes(l))&&matchQ(w));
  $('#wc').textContent=`${list.length} words · tap a word for its reading · 注 for meaning`;
  $('#wl').innerHTML=list.slice(0,1500).map(w=>`<div class="row" data-i="${w.i}"><button class="pb" data-p="${w.i}">▶</button><div class="body"><span class="wd">${html(w.w)}</span><span class="tag">${esc(w.p)}</span><a class="nt" href="#">注</a>${w.ms?`<div class="ms">${html(w.ms)}</div>`:''}<div class="nb">${esc(w.m)} · ${lesTxt(w.l)}</div></div></div>`).join('');
  wItems=[...$('#wl').children].map(el=>({el,mu:W[el.dataset.i].w,w:W[el.dataset.i]}));
  wItems.forEach(it=>{if(/[㐀-鿿]/.test(it.mu)===false)it.mu=it.w.r});
}
$('#wl').addEventListener('click',e=>{const b=e.target.closest('.pb');if(b){const it=wItems.find(x=>x.el===b.parentElement);play([it])}});
$('#cat').onchange=$('#les').onchange=()=>{renderWords();resetCards()};
$('#pall').onclick=()=>play(wItems,'Words');
// ---------- Verbs ----------
let vItems=[];
function renderVerbs(){
  const g=$('#vg').value,s=$('#vs').value,l=+$('#vles').value;
  let list=W.filter(w=>w.f&&(g==='a'||w.c===+g)&&(!l||w.l.includes(l))&&matchQ(w));
  if(s==='e')list=list.slice().sort((a,b)=>(a.c-b.c)||((a.e??1e9)-(b.e??1e9))||a.r.localeCompare(b.r,'ja'));
  $('#vc').textContent=`${list.length} verbs · tap Forms for all 13 forms`;
  let last='';
  $('#vl').innerHTML=list.map(w=>{
    let head='';
    if(s==='e'&&w.c===1){const end='～'+w.r.slice(-1);if(end!==last){last=end;head=`<div class="cnt" style="margin-top:12px;font-weight:600">${end}</div>`}}
    return head+`<div class="row" data-i="${w.i}" style="align-items:flex-start"><button class="pb" data-k="w">▶</button><div class="body"><span class="wd">${html(w.w)}</span><span class="tag">${esc(w.p)}</span><a class="nt" href="#">注</a><div class="nb">${esc(w.m)} · ${lesTxt(w.l)}</div><button class="fx">Forms ▾</button><div class="forms">${w.f.map((f,j)=>f==='—'?`<div class="fm"><span class="fl">${D.forms[j]}</span><span class="fv" style="color:var(--mute)">—</span></div>`:`<div class="fm" data-j="${j}"><span class="fl">${D.forms[j]}</span><span class="fv wd">${html(f)}</span><button class="pb">▶</button></div>`).join('')}${w.f.some(x=>x!=='—')?`<button class="fx" data-all="1">▶ All forms</button>`:''}</div></div></div>`}).join('');
}
$('#vl').addEventListener('click',e=>{
  const row=e.target.closest('.row');if(!row)return;const w=W[row.dataset.i];
  const fx=e.target.closest('.fx');
  if(fx&&fx.dataset.all){play([...row.querySelectorAll('.fm[data-j]')].map(el=>({el,mu:w.f[el.dataset.j].replace(/／.*/,'')})),'Forms');return}
  if(fx){const f=row.querySelector('.forms');f.classList.toggle('on');fx.textContent=f.classList.contains('on')?'Forms ▴':'Forms ▾';return}
  const b=e.target.closest('.pb');if(!b)return;
  const fm=b.closest('.fm');
  if(fm)play([{el:fm,mu:w.f[fm.dataset.j].replace(/／/,'、')}]);else play([{el:row,mu:w.w}]);
});
$('#vg').onchange=$('#vs').onchange=$('#vles').onchange=renderVerbs;
// ---------- Practice ----------
function renderPractice(){
  $('#pj').innerHTML=D.pts.map((p,i)=>`<option value="${i}">${p.t} (${p.s.length})</option>`).join('');
  $('#pl').innerHTML=D.pts.map((p,i)=>`<div class="pt" id="pt${i}"><h2><span>${esc(p.t)}</span><a class="nt" href="#">注</a><button class="pb" data-pa="${i}">▶</button></h2><div class="nb">${esc(p.n)}</div>${p.s.map((s,j)=>`<div class="sen" data-i="${i}" data-j="${j}"><button class="pb">▶</button><div class="tx">${html(s[0])} <a class="nt" href="#">注</a><div class="nb">${esc(s[1])}</div></div></div>`).join('')}</div>`).join('');
}
function ptItems(i){return [...document.querySelectorAll(`#pt${i} .sen`)].map(el=>({el,mu:D.pts[i].s[el.dataset.j][0]}))}
$('#pl').addEventListener('click',e=>{
  const b=e.target.closest('.pb');if(!b)return;
  if(b.dataset.pa!==undefined){play(ptItems(+b.dataset.pa),D.pts[b.dataset.pa].k);return}
  const s=b.closest('.sen');play([{el:s,mu:D.pts[s.dataset.i].s[s.dataset.j][0]}]);
});
$('#pj').onchange=()=>{const el=$('#pt'+$('#pj').value);window.scrollTo({top:el.offsetTop-110,behavior:'smooth'})};
$('#ppall').onclick=()=>{const i=+$('#pj').value;play(ptItems(i),D.pts[i].k)};
// ---------- Cards ----------
$('#cf').innerHTML='<option value="-1">Any form</option>'+D.forms.map((f,i)=>`<option value="${i}">${f}</option>`).join('');
let deck=[],ci=0,shown=false;
function resetCards(shuffle){
  const m=$('#cm').value;$('#cf').classList.toggle('hide',m!=='vf');
  const c=+$('#cat').value,l=+$('#les').value;
  if(m==='vf'){
    const fsel=+$('#cf').value;deck=[];
    W.filter(w=>w.f&&(!l||w.l.includes(l))).forEach(w=>w.f.forEach((f,j)=>{if(f!=='—'&&j>0&&(fsel<0||fsel===j))deck.push({w,j})}));
  }else deck=W.filter(w=>(c<0||w.c===c)&&(!l||w.l.includes(l))).map(w=>({w}));
  if(shuffle||m==='vf')for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  ci=0;showCard();
}
function showCard(){
  shown=false;$('#cshow').textContent='Show';const m=$('#cm').value;
  if(!deck.length){$('#cq').textContent='No cards';$('#cs').textContent='';$('#ca').innerHTML='';$('#cc').textContent='';return}
  const d=deck[ci],w=d.w;$('#cc').textContent=`${ci+1} / ${deck.length} · filter: ${m==='vf'?'verbs':$('#cat').selectedOptions[0].text}, ${$('#les').selectedOptions[0].text}`;
  const q=$('#cq');q.className='q';
  if(m==='jc'){q.innerHTML=esc(w.pl);$('#cs').textContent=w.p}
  else if(m==='cj'){q.className='q cn';q.textContent=w.m;$('#cs').textContent=w.p}
  else{q.innerHTML=esc(w.pl);$('#cs').textContent='→ '+D.forms[d.j]}
  $('#ca').innerHTML='';
}
function reveal(){
  const d=deck[ci];if(!d)return;const w=d.w,m=$('#cm').value;shown=true;$('#cshow').textContent='Hide';
  if(m==='jc')$('#ca').innerHTML=`<div class="r2">${esc(w.r)}</div><div>${esc(w.m)}</div><div class="sub">${lesTxt(w.l)}</div>`;
  else if(m==='cj')$('#ca').innerHTML=`<div style="font-size:30px">${esc(w.pl)}</div><div class="r2">${esc(w.r)}</div><div class="sub">${lesTxt(w.l)}</div>`;
  else{const f=w.f[d.j];$('#ca').innerHTML=`<div style="font-size:28px">${esc(plain(f))}</div>${plain(f)!==kana(f)?`<div class="r2">${esc(kana(f))}</div>`:''}<div class="sub">${esc(w.m)}</div>`}
  cardSay();
}
function cardSay(){const d=deck[ci];if(!d)return;const m=$('#cm').value;if(m==='cj'&&!shown)return;play([{el:null,mu:m==='vf'?(shown?d.w.f[d.j].replace(/／/,'、'):d.w.w):d.w.w}])}
$('#cshow').onclick=()=>shown?showCard():reveal();
$('#card').onclick=()=>shown?null:reveal();
$('#cnext').onclick=()=>{if(deck.length){ci=(ci+1)%deck.length;showCard()}};
$('#cprev').onclick=()=>{if(deck.length){ci=(ci-1+deck.length)%deck.length;showCard()}};
$('#cplay').onclick=cardSay;
$('#cshuf').onclick=()=>resetCards(true);
$('#cm').onchange=$('#cf').onchange=()=>resetCards();
// ---------- search ----------
$('#sbtn').onclick=$('#vsbtn').onclick=()=>{const r=$('#srow');r.classList.toggle('hide');if(!r.classList.contains('hide'))$('#q').focus();else{$('#q').value='';query='';renderWords();renderVerbs()}};
let qt;$('#q').oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>{query=$('#q').value.trim();renderWords();renderVerbs()},200)};
// ---------- tabs ----------
function tab(t){
  stop();S.tab=t;save();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['w','v','p','c'].forEach(x=>{$('#p'+x).classList.toggle('hide',x!==t);$('#t'+x).classList.toggle('hide',x!==t)});
  if(t==='p'||t==='c')$('#srow').classList.add('hide');
  if(t==='c'&&!deck.length)resetCards();
  scrollTo(0,0);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
$('#foot').innerHTML='<details><summary>About &amp; corrections</summary>Source: Google Sheet “Japanese Vocabulary” (新版标准日本语 初级 第1～48课, '+W.length+' words). Group 2/3 verb forms are generated by rule; Group 1 forms are from the sheet. Corrections: '+FIXES.map(esc).join('；')+'.</details>';
renderWords();renderVerbs();renderPractice();tab(S.tab||'w');
</script>
</body>
</html>
